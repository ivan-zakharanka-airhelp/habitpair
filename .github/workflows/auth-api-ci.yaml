name: auth-api

on:
  pull_request:
    paths:
      - 'apps/auth-api/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/auth-api-ci.yaml'
  push:
    branches: [main]
    paths:
      - 'apps/auth-api/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/auth-api-ci.yaml'
  workflow_dispatch:

concurrency:
  group: auth-api-${{ github.ref }}
  # PRs cancel in-progress (latest push wins). Main pushes don't —
  # half-rolled-out k8s deployments are worse than waiting.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# GITHUB_TOKEN needs `packages: write` to push to GHCR.
permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run generate -w @habitpair/auth-api

      - name: Lint
        run: npm run lint -w @habitpair/auth-api

      - name: Build auth-api
        run: npm run build -w @habitpair/auth-api

      - name: Run migrations
        run: npm run migrate:deploy -w @habitpair/auth-api
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test

      - name: Test
        run: npm test -w @habitpair/auth-api
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # QEMU lets the amd64 GitHub runner build for arm64 via binfmt emulation.
      # Needed because our EC2 is t4g (Graviton/ARM64).
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/auth-api/Dockerfile
          platforms: linux/arm64        # must match EC2 architecture (t4g = Graviton)
          push: true
          tags: ghcr.io/${{ github.repository }}/auth-api:${{ github.sha }}
          cache-from: type=gha          # speed up future builds via GHA cache
          cache-to: type=gha,mode=max

      - name: Deploy to k3s
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_KEY }}
          # KUBECONFIG must be set explicitly — non-interactive SSH doesn't source .bashrc
          # or .profile, so the shell env from cloud-init's bashrc line isn't inherited here.
          script: |
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
            kubectl set image deployment/auth-api \
              auth-api=ghcr.io/${{ github.repository }}/auth-api:${{ github.sha }} \
              -n habitpair
            kubectl rollout status deployment/auth-api -n habitpair --timeout=120s
