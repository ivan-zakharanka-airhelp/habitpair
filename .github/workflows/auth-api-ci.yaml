name: auth-api-ci
on:
  pull_request:
    paths:
      - 'apps/auth-api/**'
      - 'packages/database/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/auth-api-ci.yaml'

concurrency:
  group: auth-api-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run generate -w @habitpair/database

      - name: Build database package
        run: npm run build -w @habitpair/database

      - name: Lint
        run: npm run lint -w @habitpair/auth-api

      - name: Build auth-api
        run: npm run build -w @habitpair/auth-api

      - name: Run migrations
        run: npm run migrate:deploy -w @habitpair/database
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test

      - name: Test
        run: npm test -w @habitpair/auth-api
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
