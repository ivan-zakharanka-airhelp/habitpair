name: web / deploy

on:
  workflow_run:
    workflows: ["web / test"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: web-deploy-${{ github.ref }}
  cancel-in-progress: false

# `actions: read` lets wait-for-apis poll sibling deploy/test runs via the API.
# `contents: read` is all the build/deploy jobs need (checkout + artifacts);
# AWS access uses repo secrets, not GITHUB_TOKEN.
permissions:
  contents: read
  actions: read

jobs:
  build:
    # Manual dispatch always runs. workflow_run fires on ANY conclusion (success/failure/cancelled),
    # so we must explicitly require success — otherwise a failed test would still deploy.
    # The guard lives on `build` only; `deploy` skips transitively via `needs:`.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      # Build-time API URLs baked into the bundle. apiClient.ts callers pass paths like
      # `/auth/health` or `/habits/health`; in production both services share a host and
      # are routed by path, with Traefik's `api-strip` middleware stripping the leading
      # `/api` before forwarding to the auth-api / habits-api pods. So both vars resolve
      # to the same origin in prod — they only diverge for local dev (different ports).
      VITE_AUTH_API_URL: https://api.habitpair.com/api
      VITE_HABITS_API_URL: https://api.habitpair.com/api
    steps:
      # On workflow_run, github.sha is the default-branch HEAD at event-creation time,
      # not the commit tests passed on. Pin to the upstream run's head_sha to be safe.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build -w @habitpair/web

      - name: Upload built SPA
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: apps/web/dist/
          retention-days: 1
          if-no-files-found: error

  # When a single merge to main touches both the SPA and an API, the SPA must not
  # go live before the API it depends on. The per-app deploys run as independent
  # workflow_run pipelines with no ordering, and web/test (no Postgres, no e2e) is
  # far faster than an API pipeline (arm64 QEMU build + Trivy + migrate + rollout),
  # so without this gate the SPA ships first and briefly calls endpoints that
  # aren't deployed yet. Block the SPA deploy until each *changed* API's deploy
  # has finished successfully.
  #
  # "Changed" is inferred from whether that API's test workflow ran for this exact
  # commit — it shares the API's path filter and was queued at push time alongside
  # web/test, so it already exists by the time web/test finishes and triggers us.
  # No test run for this SHA => the API was untouched => we don't wait on it.
  #
  # Fails closed: if a changed API's tests or deploy don't succeed, this job fails
  # and `deploy` is skipped via `needs:` — the SPA never ships ahead of a broken or
  # absent backend, matching the repo's "don't ship on failure" deploy philosophy.
  wait-for-apis:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Wait for changed API deploys to finish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail

          # Newest run of a workflow file at this commit, filtered by trigger event.
          # Prints "<status> <conclusion>", or nothing when no such run exists.
          run_state() {
            gh api \
              "/repos/$REPO/actions/workflows/$1/runs?head_sha=$SHA&event=$2&per_page=1" \
              --jq '.workflow_runs[0] // empty | "\(.status) \(.conclusion)"'
          }

          wait_for_api() {
            local api="$1"
            local test_wf="${api}-test.yaml"
            local deploy_wf="${api}-deploy.yaml"
            local s status conclusion deadline

            s="$(run_state "$test_wf" push)"
            if [ -z "$s" ]; then
              echo "$api: no test run for $SHA — unchanged, not waiting."
              return 0
            fi
            echo "$api: changed in this push — gating the SPA deploy on its pipeline."

            deadline=$(( $(date +%s) + 1800 ))   # 30-minute ceiling
            while :; do
              if [ "$(date +%s)" -ge "$deadline" ]; then
                echo "::error::Timed out after 30m waiting for $api deploy of $SHA."
                return 1
              fi

              # Phase 1 — the API's tests must pass, otherwise its deploy never runs.
              s="$(run_state "$test_wf" push)"
              status="${s%% *}"; conclusion="${s#* }"
              if [ "$status" != "completed" ]; then sleep 20; continue; fi
              if [ "$conclusion" != "success" ]; then
                echo "::error::$api tests for $SHA concluded '$conclusion' — its deploy will not run; not shipping the SPA."
                return 1
              fi

              # Phase 2 — tests are green, so the workflow_run-triggered deploy will
              # appear; wait for it to finish rolling out.
              s="$(run_state "$deploy_wf" workflow_run)"
              if [ -z "$s" ]; then echo "$api: tests green, deploy not created yet…"; sleep 20; continue; fi
              status="${s%% *}"; conclusion="${s#* }"
              if [ "$status" != "completed" ]; then echo "$api: deploy $status…"; sleep 20; continue; fi
              if [ "$conclusion" != "success" ]; then
                echo "::error::$api deploy of $SHA concluded '$conclusion'. Not shipping the SPA."
                return 1
              fi
              echo "$api: deploy succeeded."
              return 0
            done
          }

          wait_for_api auth-api
          wait_for_api habits-api
          echo "All changed APIs are deployed — proceeding with the SPA deploy."

  deploy:
    needs: [build, wait-for-apis]
    runs-on: ubuntu-latest
    env:
      AWS_REGION: eu-west-1
    steps:
      - name: Download built SPA
        uses: actions/download-artifact@v7
        with:
          name: web-dist
          path: apps/web/dist/

      # TEMPORARY: using AWS IAM Identity Center (SSO) session credentials
      # because the SSO role can't create IAM users either. These expire
      # after ~12h — refresh all three secrets when CI starts failing with
      # "security token included in the request is invalid".
      # Replace with permanent IAM-user access keys (no session token) or
      # OIDC role-assume once an admin can provision either.
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      # Hashed assets — immutable for a year (PWA files excluded: they must stay no-cache)
      - name: Sync hashed assets
        run: |
          aws s3 sync apps/web/dist/ s3://${{ vars.WEB_BUCKET_NAME }}/ \
            --delete \
            --exclude "index.html" \
            --exclude "sw.js" \
            --exclude "workbox-*.js" \
            --exclude "manifest.webmanifest" \
            --cache-control "public, max-age=31536000, immutable"

      # index.html — no-cache so users get the latest entrypoint after invalidation
      - name: Sync index.html
        run: |
          aws s3 cp apps/web/dist/index.html s3://${{ vars.WEB_BUCKET_NAME }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html; charset=utf-8"

      # PWA files — never cache; explicit content-types (S3 mis-guesses .webmanifest)
      - name: Sync service worker + manifest
        run: |
          aws s3 cp apps/web/dist/sw.js s3://${{ vars.WEB_BUCKET_NAME }}/sw.js \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "application/javascript"
          aws s3 cp apps/web/dist/manifest.webmanifest s3://${{ vars.WEB_BUCKET_NAME }}/manifest.webmanifest \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "application/manifest+json"
          aws s3 sync apps/web/dist/ s3://${{ vars.WEB_BUCKET_NAME }}/ \
            --exclude "*" --include "workbox-*.js" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "application/javascript"

      - name: Invalidate CloudFront /index.html
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.WEB_DISTRIBUTION_ID }} \
            --paths "/index.html" "/" "/sw.js" "/manifest.webmanifest" "/workbox-*.js"
