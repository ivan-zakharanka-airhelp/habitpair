name: infra

# Lint-only for now. Plan and apply would need:
#   1. Remote Terraform state (we're still on local state — see infra/terraform/README.md)
#   2. An OIDC-trusted IAM role to assume (currently blocked — see oidc.tf.disabled)
# Until both are in place, `terraform apply` runs from a developer's laptop
# (`make aws-up`) and CI just verifies the code is well-formed.

on:
  pull_request:
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/infra-ci.yaml'
  push:
    branches: [main]
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/infra-ci.yaml'

concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TF_VERSION: '1.9.8'

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      # init -backend=false skips state access (we don't have remote state).
      # Still pulls providers so validate has the schemas it needs.
      - name: Terraform init (providers only)
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        run: terraform validate
