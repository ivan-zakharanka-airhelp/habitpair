name: web

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/web-ci.yaml'
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/web-ci.yaml'

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint -w @habitpair/web
      - run: npm run typecheck -w @habitpair/web
      - run: npm run test -w @habitpair/web

  build-and-deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      AWS_REGION: eu-west-1
      # Build-time API URL baked into the bundle. The /api suffix is required —
      # Traefik's `api-strip` middleware routes only PathPrefix(`/api`).
      VITE_API_URL: https://api.habitpair.com/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build -w @habitpair/web

      # TEMPORARY: using AWS IAM Identity Center (SSO) session credentials
      # because the SSO role can't create IAM users either. These expire
      # after ~12h — refresh all three secrets when CI starts failing with
      # "security token included in the request is invalid".
      # Replace with permanent IAM-user access keys (no session token) or
      # OIDC role-assume once an admin can provision either.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      # Hashed assets — immutable for a year
      - name: Sync hashed assets
        run: |
          aws s3 sync apps/web/dist/ s3://${{ vars.WEB_BUCKET_NAME }}/ \
            --delete \
            --exclude "index.html" \
            --cache-control "public, max-age=31536000, immutable"

      # index.html — no-cache so users get the latest entrypoint after invalidation
      - name: Sync index.html
        run: |
          aws s3 cp apps/web/dist/index.html s3://${{ vars.WEB_BUCKET_NAME }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html; charset=utf-8"

      - name: Invalidate CloudFront /index.html
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.WEB_DISTRIBUTION_ID }} \
            --paths "/index.html" "/"
