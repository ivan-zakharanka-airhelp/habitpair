name: habits-api / deploy

on:
  workflow_run:
    workflows: ["habits-api / test"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: habits-api-deploy-${{ github.ref }}
  # Main pushes don't cancel — half-rolled-out k8s deployments are worse than waiting.
  cancel-in-progress: false

# GITHUB_TOKEN needs `packages: write` to push to GHCR
# and `security-events: write` to upload Trivy SARIF results to the Security tab.
permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  build:
    # Manual dispatch always runs. workflow_run fires on ANY conclusion (success/failure/cancelled),
    # so we must explicitly require success — otherwise a failed test would still deploy.
    # The guard lives on `build` only; `scan` and `deploy` skip transitively via `needs:`.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      # On workflow_run, github.sha is the default-branch HEAD at event-creation time,
      # not the commit tests passed on. Pin to the upstream run's head_sha to be safe.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # Consolidate the head_sha-or-fallback expression here once; downstream jobs
      # consume needs.build.outputs.image.
      - id: meta
        run: |
          TAG="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "image=ghcr.io/${{ github.repository }}/habits-api:${TAG}" >> "$GITHUB_OUTPUT"

      # QEMU lets the amd64 GitHub runner build for arm64 via binfmt emulation.
      # Needed because our EC2 is t4g (Graviton/ARM64).
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/habits-api/Dockerfile
          platforms: linux/arm64        # must match EC2 architecture (t4g = Graviton)
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha          # speed up future builds via GHA cache
          cache-to: type=gha,mode=max

  scan:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # exit-code: '0' = report-only on initial rollout. Flip to '1' in a follow-up PR
      # once existing HIGH/CRITICAL findings in the node:22-alpine base have been triaged.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ needs.build.outputs.image }}
          severity: HIGH,CRITICAL
          exit-code: '0'
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy results to Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-habits-api

  deploy:
    needs: [build, scan]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to k3s
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_KEY }}
          # KUBECONFIG must be set explicitly — non-interactive SSH doesn't source .bashrc
          # or .profile, so the shell env from cloud-init's bashrc line isn't inherited here.
          script: |
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
            kubectl set image deployment/habits-api \
              habits-api=${{ needs.build.outputs.image }} \
              -n habitpair
            kubectl rollout status deployment/habits-api -n habitpair --timeout=120s
