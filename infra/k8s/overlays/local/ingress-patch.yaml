apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: api-gateway
  namespace: habitpair
spec:
  entryPoints:
    - web
  routes:
    # Every path is service-scoped: /api/<service>/... See base/ingress.yaml.
    - match: PathPrefix(`/api/auth`)
      kind: Rule
      middlewares:
        - name: rate-limit-auth
        - name: security-headers
        - name: api-strip
      services:
        - name: auth-api-service
          port: 3000
    - match: PathPrefix(`/api/habits`)
      kind: Rule
      middlewares:
        - name: rate-limit
        - name: security-headers
        - name: api-strip
      services:
        - name: habits-api-service
          port: 3000
  # No TLS — local k3d uses plain HTTP on port 8080
