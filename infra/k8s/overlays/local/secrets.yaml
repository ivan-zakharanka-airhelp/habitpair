apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: habitpair
type: Opaque
stringData:
  url: "postgresql://dev:dev@host.k3d.internal:5434/auth"
---
apiVersion: v1
kind: Secret
metadata:
  name: habits-db-credentials
  namespace: habitpair
type: Opaque
stringData:
  url: "postgresql://dev:dev@host.k3d.internal:5434/habits"
---
# Local dev only — matches the fallback in apps/habits-api/src/app.module.ts so
# the e2e test can sign tokens with the same key Kubernetes-deployed pods use.
apiVersion: v1
kind: Secret
metadata:
  name: auth-jwt-secret
  namespace: habitpair
type: Opaque
stringData:
  secret: "unsafe-dev-only-secret"
