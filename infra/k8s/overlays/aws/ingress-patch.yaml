apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: api-gateway
  namespace: habitpair
spec:
  # HTTPS only — ACME HTTP-01 challenge on port 80 is handled internally
  # by Traefik (doesn't need a route here).
  entryPoints:
    - websecure
  routes:
    # Every path is service-scoped: /api/<service>/... See base/ingress.yaml.
    - match: Host(`api.habitpair.com`) && PathPrefix(`/api/auth`)
      kind: Rule
      middlewares:
        - name: rate-limit-auth
        - name: security-headers
        - name: api-strip
      services:
        - name: auth-api-service
          port: 3000
    - match: Host(`api.habitpair.com`) && PathPrefix(`/api/habits`)
      kind: Rule
      middlewares:
        - name: rate-limit
        - name: security-headers
        - name: api-strip
      services:
        - name: habits-api-service
          port: 3000
  # tls.certResolver is inherited from base/ingress.yaml via strategic merge.
  # No patch needed here for TLS.
