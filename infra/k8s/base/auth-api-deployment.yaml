apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-api
  namespace: habitpair
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-api
  template:
    metadata:
      labels:
        app: auth-api
    spec:
      # Applies pending Prisma migrations before the app starts. Shares the app
      # image (same name → kustomize remaps it too); a failed migration fails pod
      # init, so the rollout stops and the previous ReplicaSet keeps serving.
      initContainers:
        - name: migrate
          image: auth-api:latest
          command: ["npx", "prisma", "migrate", "deploy", "--schema=apps/auth-api/prisma/schema.prisma"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: url
      containers:
        - name: auth-api
          image: auth-api:latest
          ports:
            - containerPort: 3000
          livenessProbe:
            httpGet:
              path: /auth/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /auth/health/ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "384Mi"
              cpu: "500m"
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: url
            # Shared with habits-api — auth-api signs with this, habits-api verifies.
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-jwt-secret
                  key: secret
            # Origins allowed to call the API (CORS). For local dev,
            # main.ts defaults to http://localhost:5173 if unset.
            - name: CORS_ORIGINS
              value: https://habitpair.com
