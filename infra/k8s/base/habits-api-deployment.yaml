apiVersion: apps/v1
kind: Deployment
metadata:
  name: habits-api
  namespace: habitpair
spec:
  replicas: 1
  selector:
    matchLabels:
      app: habits-api
  template:
    metadata:
      labels:
        app: habits-api
    spec:
      # Applies pending Prisma migrations before the app starts. Shares the app
      # image (same name → kustomize remaps it too); a failed migration fails pod
      # init, so the rollout stops and the previous ReplicaSet keeps serving.
      initContainers:
        - name: migrate
          image: habits-api:latest
          command: ["npx", "prisma", "migrate", "deploy", "--schema=apps/habits-api/prisma/schema.prisma"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: habits-db-credentials
                  key: url
      containers:
        - name: habits-api
          image: habits-api:latest
          ports:
            - containerPort: 3000
          livenessProbe:
            httpGet:
              path: /habits/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /habits/health/ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "384Mi"
              cpu: "500m"
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: habits-db-credentials
                  key: url
            # Shared with auth-api — both services HS256-verify against this secret.
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-jwt-secret
                  key: secret
            - name: CORS_ORIGINS
              value: https://habitpair.com
