        "acceptedAnswer": { "@type": "Answer", "text": "Most trackers only tell you that you missed a day. Habitpair shows you why: a calm day-of-week grid reveals the patterns behind your misses, like consistently slipping on Wednesdays, so you can fix the cause instead of just resetting a streak." }
      },
      {
        "@type": "Question",
        "name": "Can Habitpair help me break a bad habit, not just build a good one?",
        "acceptedAnswer": { "@type": "Answer", "text": "Yes. Habitpair tracks both. 'Building' habits count the days you show up; 'breaking' habits count the days you stay clean. Both live in the same honest grid." }
      },

        "@type": "Question",
        "name": "Is Habitpair free?",
        "acceptedAnswer": { "@type": "Answer", "text": "Yes. Habitpair is free to use. There are no ads and no motivational spam." }

        "@type": "Question",
        "name": "Is my habit data private?",
        "acceptedAnswer": { "@type": "Answer", "text": "Your data is private by default and never sold. You can export everything you've logged to a single file at any time." }
      },
      {
        "@type": "Question",
        "name": "Does Habitpair send reminders or notifications?",
        "acceptedAnswer": { "@type": "Answer", "text": "No nagging. Habitpair is intentionally quiet. You open it when you want to mark a day, and it shows you what's happening without guilt-tripping notifications." }
      }
    ]

  src: url("1f40f2c8-d717-400e-908d-82778c776890") format('woff2');
  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
}
/* latin */
@font-face {
  font-family: 'Newsreader';
  font-style: normal;
  font-weight: 600;
  font-display: swap;
  src: url("95d3bd3e-8a73-4a08-8f14-aac564383e1a") format('woff2');
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}


:root {
  /* warm light — the calm base */
  --bg:        oklch(0.985 0.006 83);
  --bg-2:      oklch(0.972 0.008 83);
  --surface:   oklch(0.998 0.003 83);
  --surface-2: oklch(0.965 0.008 83);
  --ink:       oklch(0.27 0.012 65);
  --ink-2:     oklch(0.46 0.012 65);
  --ink-3:     oklch(0.62 0.010 65);
  --line:      oklch(0.905 0.008 78);
  --line-2:    oklch(0.86 0.010 78);

  --accent:      oklch(0.52 0.10 162);
  --accent-2:    oklch(0.46 0.105 162);
  --accent-soft: oklch(0.955 0.032 162);
  --accent-ink:  #fff;

  --success:      oklch(0.64 0.105 150);
  --success-soft: oklch(0.945 0.038 150);
  --success-ink:  oklch(0.46 0.105 150);
  --miss:         oklch(0.62 0.115 28);
  --miss-soft:    oklch(0.948 0.042 30);
  --miss-ink:     oklch(0.52 0.13 28);

  --ring: color-mix(in oklch, var(--accent) 45%, transparent);

  --font-sans: 'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif;
  --font-serif: 'Newsreader', Georgia, serif;
  --font-display: var(--font-sans);

  --radius: 14px;
  --radius-sm: calc(var(--radius) * 0.55);
  --radius-lg: calc(var(--radius) * 1.5);
  --radius-pill: 999px;

  /* component tokens — overridden per direction */
  --card-bg: var(--surface);
  --card-border: 1px solid var(--line);
  --card-shadow: 0 1px 2px oklch(0.4 0.02 65 / 0.04), 0 14px 30px -18px oklch(0.4 0.03 65 / 0.22);
  --field-bg: var(--surface);
  --section-weight: 600;
  --title-weight: 700;
  --letter-display: -0.01em;
}

/* ── dark (warm charcoal) ─────────────────────────────────────────────── */
[data-theme="dark"] {
  --bg:        oklch(0.205 0.008 75);
  --bg-2:      oklch(0.185 0.008 75);
  --surface:   oklch(0.248 0.009 75);
  --surface-2: oklch(0.295 0.010 75);
  --ink:       oklch(0.94 0.006 83);
  --ink-2:     oklch(0.76 0.008 83);
  --ink-3:     oklch(0.60 0.008 83);
  --line:      oklch(0.32 0.010 75);
  --line-2:    oklch(0.40 0.012 75);
  /* Re-resolve against the dark surface: --field-bg is declared on :root,
     where var(--surface) is still the light value because data-theme lives
     on .app, not <html>. Without this, fields render near-white in dark mode. */
  --field-bg:  var(--surface);

  --accent-ink:  oklch(0.18 0.012 75);
  --card-shadow: 0 1px 2px rgba(0,0,0,0.3), 0 18px 36px -20px rgba(0,0,0,0.6);
}

/* ── directions ──────────────────────────────────────────────────────── */
/* Quiet: flat, hairline separators, surface == bg, no shadow */
[data-direction="quiet"] {
  --card-bg: transparent;
  --card-border: 1px solid var(--line);
  --card-shadow: none;
  --field-bg: transparent;
  --section-weight: 600;
  --title-weight: 600;
  --letter-display: -0.005em;
}
/* Soft: gentle elevated cards (default look) */
[data-direction="soft"] {
  --card-bg: var(--surface);
  --card-border: 1px solid color-mix(in oklch, var(--line) 70%, transparent);
}
/* Editorial: serif display, structural rules, flat surfaces */
[data-direction="editorial"] {
  --card-bg: transparent;
  --card-border: 1px solid var(--line);
  --card-shadow: none;
  --field-bg: transparent;
  --font-display: var(--font-serif);
  --section-weight: 600;
  --title-weight: 500;
  --letter-display: -0.015em;
}

/* ── accents ─────────────────────────────────────────────────────────── */
[data-accent="green"]  { --accent: oklch(0.52 0.10 162);  --accent-2: oklch(0.46 0.105 162); --accent-soft: oklch(0.955 0.032 162); }
[data-accent="teal"]   { --accent: oklch(0.56 0.072 185); --accent-2: oklch(0.50 0.078 185); --accent-soft: oklch(0.955 0.028 185); }
[data-accent="violet"] { --accent: oklch(0.55 0.13 290);  --accent-2: oklch(0.49 0.14 290);  --accent-soft: oklch(0.955 0.03 290); }
[data-accent="clay"]   { --accent: oklch(0.62 0.115 47);  --accent-2: oklch(0.56 0.12 47);   --accent-soft: oklch(0.955 0.035 55); }

[data-theme="dark"][data-accent="green"]  { --accent: oklch(0.76 0.11 162); --accent-2: oklch(0.82 0.11 162); --accent-soft: oklch(0.33 0.055 162); }
[data-theme="dark"][data-accent="teal"]   { --accent: oklch(0.74 0.10 185); --accent-2: oklch(0.80 0.10 185); --accent-soft: oklch(0.33 0.05 185); }
[data-theme="dark"][data-accent="violet"] { --accent: oklch(0.72 0.13 290); --accent-2: oklch(0.78 0.13 290); --accent-soft: oklch(0.33 0.06 290); }
[data-theme="dark"][data-accent="clay"]   { --accent: oklch(0.74 0.115 50); --accent-2: oklch(0.80 0.115 50); --accent-soft: oklch(0.34 0.06 50); }

/* ── status palette ──────────────────────────────────────────────────── */
[data-status="classic"] {
  --success: oklch(0.60 0.17 150); --success-soft: oklch(0.93 0.07 150); --success-ink: oklch(0.45 0.17 150);
  --miss:    oklch(0.57 0.21 27);  --miss-soft:    oklch(0.93 0.08 28);  --miss-ink:    oklch(0.50 0.21 27);
}
[data-theme="dark"][data-status="muted"] {
  --success-soft: oklch(0.34 0.05 150); --success-ink: oklch(0.78 0.10 150);
  --miss-soft:    oklch(0.34 0.055 30); --miss-ink:    oklch(0.76 0.11 28);
}
[data-theme="dark"][data-status="classic"] {
  --success: oklch(0.68 0.17 150); --success-soft: oklch(0.36 0.08 150); --success-ink: oklch(0.80 0.15 150);
  --miss:    oklch(0.64 0.20 27);  --miss-soft:    oklch(0.36 0.09 28);  --miss-ink:    oklch(0.78 0.16 28);
}


/* habitpair — component styles. All color/shape pulls from theme.css tokens. */

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: var(--bg); }

.app {
  min-height: 100vh;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  transition: background-color .35s ease, color .35s ease;
}
.app, .card, .btn, .input, .select, .seg, .metric, .nav, .cal-cell, .switch, .chip {
  transition: background-color .3s ease, border-color .3s ease, color .3s ease, box-shadow .3s ease;
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}

a { color: inherit; }
button { font-family: inherit; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; border-radius: var(--radius-sm); }

.container { width: 100%; max-width: 980px; margin: 0 auto; padding: 0 20px; }
.container--narrow { max-width: 460px; }

/* ── nav ─────────────────────────────────────────────────────────────── */
.nav {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 14px 0;
  background: color-mix(in oklch, var(--bg) 86%, transparent);
  backdrop-filter: blur(14px) saturate(140%);
  -webkit-backdrop-filter: blur(14px) saturate(140%);
  border-bottom: 1px solid var(--line);
}
.nav__inner { width: 100%; max-width: 980px; margin: 0 auto; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: inline-flex; align-items: center; gap: 9px; font-weight: 700; font-size: 1.18rem; letter-spacing: -0.02em; text-decoration: none; color: var(--ink); cursor: pointer; background: none; border: 0; padding: 0; }
.brand__mark { width: 22px; height: 22px; border-radius: 7px; background: var(--accent); display: grid; place-items: center; flex: none; }
.brand__mark::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent-ink); }
[data-direction="editorial"] .brand { font-family: var(--font-serif); font-weight: 600; letter-spacing: -0.02em; }
.nav__right { display: flex; align-items: center; gap: 10px; }
.nav__email { color: var(--ink-3); font-size: .85rem; max-width: 38vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (max-width: 560px) { .nav__email { display: none; } }

/* ── buttons ─────────────────────────────────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font-size: .94rem; font-weight: 600; line-height: 1;
  padding: 11px 16px; border-radius: var(--radius-sm); border: 1px solid transparent;
  background: transparent; color: var(--ink); cursor: pointer; white-space: nowrap;
  min-height: 42px;
}
.btn:active { transform: translateY(.5px); }
.btn--primary { background: var(--accent); color: var(--accent-ink); }
.btn--primary:hover { background: var(--accent-2); }
.btn--ghost { border-color: var(--line-2); color: var(--ink); background: var(--surface); }
[data-direction="quiet"] .btn--ghost, [data-direction="editorial"] .btn--ghost { background: transparent; }
.btn--ghost:hover { background: var(--surface-2); }
.btn--soft { background: var(--accent-soft); color: var(--accent-2); }
.btn--soft:hover { background: color-mix(in oklch, var(--accent-soft) 80%, var(--accent)); }
.btn--danger { border-color: color-mix(in oklch, var(--miss) 45%, var(--line)); color: var(--miss-ink); background: transparent; }
.btn--danger:hover { background: var(--miss-soft); }
.btn--danger-solid { background: var(--miss); color: #fff; }
.btn--danger-solid:hover { filter: brightness(.95); }
.btn--block { width: 100%; }
.btn--sm { min-height: 36px; padding: 8px 13px; font-size: .87rem; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn--lg { min-height: 50px; padding: 14px 26px; font-size: 1.02rem; }

/* ── fields ──────────────────────────────────────────────────────────── */
.field { display: flex; flex-direction: column; gap: 7px; }
.label { font-size: .82rem; font-weight: 600; color: var(--ink-2); letter-spacing: .005em; }
.input, .select, .textarea {
  width: 100%; font: inherit; font-size: .96rem; color: var(--ink);
  background: var(--field-bg); border: 1px solid var(--line-2); border-radius: var(--radius-sm);
  padding: 11px 13px; min-height: 44px;
}
.input::placeholder { color: var(--ink-3); }
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--ring); }
.select { appearance: none; cursor: pointer;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path fill='%23999' d='M1 1.5 6 6.5 11 1.5'/></svg>");
  background-repeat: no-repeat; background-position: right 13px center; padding-right: 34px; }
.field__hint { font-size: .8rem; color: var(--ink-3); }
.field__err, .form-err { font-size: .85rem; color: var(--miss-ink); display: flex; align-items: center; gap: 6px; }

/* ── card ────────────────────────────────────────────────────────────── */
.card { background: var(--card-bg); border: var(--card-border); border-radius: var(--radius); box-shadow: var(--card-shadow); }
.card--pad { padding: 22px; }

/* ── titles ──────────────────────────────────────────────────────────── */
.h1 { font-family: var(--font-display); font-weight: var(--title-weight); letter-spacing: var(--letter-display); font-size: clamp(1.6rem, 1.2rem + 1.6vw, 2.1rem); line-height: 1.12; margin: 0; color: var(--ink); }
.h2 { font-family: var(--font-display); font-weight: var(--section-weight); letter-spacing: var(--letter-display); font-size: 1.18rem; margin: 0; color: var(--ink); }
.eyebrow { font-size: .72rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
.muted { color: var(--ink-3); }
.sub { color: var(--ink-2); }

/* ── segmented control ───────────────────────────────────────────────── */
.seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius-sm); }
[data-direction="quiet"] .seg { background: transparent; }
.seg__btn { appearance: none; border: 0; background: transparent; color: var(--ink-2); font-size: .85rem; font-weight: 600; padding: 7px 13px; border-radius: calc(var(--radius-sm) - 2px); cursor: pointer; line-height: 1; min-height: 34px; }
.seg__btn:hover { color: var(--ink); }
.seg__btn[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px oklch(0.4 0.02 65 / 0.12); }
[data-theme="dark"] .seg__btn[aria-pressed="true"] { box-shadow: 0 1px 3px rgba(0,0,0,.4); }
[data-direction="editorial"] .seg__btn[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-2); box-shadow: none; }
/* In form fields, fill the field width with equal-width segments (aligns with inputs) */
.field > .seg { display: flex; width: 100%; }
.field > .seg .seg__btn { flex: 1; text-align: center; }

/* ── switch ──────────────────────────────────────────────────────────── */
.switch { position: relative; width: 46px; height: 27px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--surface-2); cursor: pointer; padding: 0; flex: none; }
.switch[data-on="true"] { background: var(--accent); border-color: var(--accent); }
.switch__dot { position: absolute; top: 2px; left: 2px; width: 21px; height: 21px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .22s cubic-bezier(.3,.7,.4,1); display: grid; place-items: center; }
.switch[data-on="true"] .switch__dot { transform: translateX(19px); }
.switch__ico { width: 12px; height: 12px; color: var(--ink-3); }
.switch[data-on="true"] .switch__ico { color: var(--accent); }

.icon-btn { display: inline-grid; place-items: center; width: 42px; height: 42px; border-radius: var(--radius-sm); border: 1px solid var(--line-2); background: var(--surface); color: var(--ink-2); cursor: pointer; }
[data-direction="quiet"] .icon-btn, [data-direction="editorial"] .icon-btn { background: transparent; }
.icon-btn:hover { color: var(--ink); background: var(--surface-2); }

/* ── habit list ──────────────────────────────────────────────────────── */
.page { padding-top: 28px; padding-bottom: 80px; }
.page__head { margin-bottom: 8px; }
.group { margin-top: 30px; }
.group__head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.group__count { font-size: .8rem; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.group__dot { width: 9px; height: 9px; border-radius: 3px; flex: none; }
.group__dot--pos { background: var(--accent); }
.group__dot--neg { background: var(--miss); }
.rows { display: flex; flex-direction: column; gap: 10px; }

.row { display: flex; align-items: center; gap: 14px; padding: 16px 18px; background: var(--card-bg); border: var(--card-border); border-radius: var(--radius); box-shadow: var(--card-shadow); }
.row__main { flex: 1; min-width: 0; cursor: pointer; display: flex; flex-direction: column; gap: 3px; background: none; border: 0; padding: 0; text-align: left; color: inherit; }
.row__name { font-weight: 600; font-size: 1.02rem; color: var(--ink); }
.row__main:hover .row__name { color: var(--accent-2); }
.row__prog { font-size: .85rem; color: var(--ink-3); display: flex; align-items: center; gap: 8px; }
.row__bar { width: 54px; height: 5px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.row__bar > i { display: block; height: 100%; border-radius: 999px; background: var(--accent); }

.markbtn { display: inline-flex; align-items: center; gap: 7px; flex: none; min-height: 42px; padding: 0 16px; border-radius: var(--radius-pill); font-size: .88rem; font-weight: 600; cursor: pointer; white-space: nowrap; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink-2); }
[data-direction="quiet"] .markbtn, [data-direction="editorial"] .markbtn { background: transparent; }
.markbtn:hover { border-color: var(--ink-3); color: var(--ink); }
.markbtn[data-done="true"] { background: var(--success); border-color: var(--success); color: #fff; }
.markbtn[data-done="true"]:hover { filter: brightness(.96); }
.markbtn__check { width: 16px; height: 16px; }

/* ── empty state ─────────────────────────────────────────────────────── */
.empty { text-align: center; padding: 48px 24px; border: 1px dashed var(--line-2); border-radius: var(--radius-lg); color: var(--ink-3); }
.empty__ico { width: 40px; height: 40px; margin: 0 auto 14px; color: var(--ink-3); opacity: .7; }

/* ── detail header ───────────────────────────────────────────────────── */
.back { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; font-size: .88rem; font-weight: 600; color: var(--accent-2); text-decoration: none; background: none; border: 0; cursor: pointer; padding: 4px 0; }
.back:hover { text-decoration: underline; }
.detail__head { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; margin-top: 14px; }
.tag { display: inline-flex; align-items: center; gap: 7px; font-size: .82rem; color: var(--ink-2); margin-top: 5px; }
.tag__chip { font-size: .72rem; font-weight: 600; letter-spacing: .03em; padding: 3px 9px; border-radius: var(--radius-pill); }
.tag__chip--pos { background: var(--accent-soft); color: var(--accent-2); }
.tag__chip--neg { background: var(--miss-soft); color: var(--miss-ink); }

/* ── metrics strip — dashboard stat cards ────────────────────────────── */
.metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 32px; }
@media (max-width: 560px) { .metrics { grid-template-columns: 1fr; gap: 10px; } }
.statcard { display: flex; flex-direction: column; gap: 14px; background: var(--card-bg); border: var(--card-border); border-radius: var(--radius); box-shadow: var(--card-shadow); padding: 17px 18px; }
.statcard__top { display: flex; align-items: center; gap: 9px; }
.statcard__chip { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 9px; flex: none; background: var(--accent-soft); color: var(--accent-2); }
.statcard__chip--success { background: var(--success-soft); color: var(--success-ink); }
.statcard__label { font-size: .7rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); white-space: nowrap; }
.statcard__body { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.statcard__val { font-family: var(--font-display); font-weight: var(--title-weight); font-size: 1.85rem; line-height: 1; color: var(--ink); letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.statcard__val .u { font-family: var(--font-body); font-size: .98rem; font-weight: 500; color: var(--ink-2); margin-left: 4px; letter-spacing: 0; }
.statcard__sub { font-size: .78rem; color: var(--ink-3); margin-top: -2px; }

/* mini progress ring inside a stat card */
.statring { position: relative; flex: none; }
.statring svg { transform: rotate(-90deg); display: block; }
.statring__track { fill: none; stroke: var(--surface-2); }
.statring__fill { fill: none; stroke-linecap: round; stroke: var(--accent); transition: stroke-dashoffset .7s cubic-bezier(.3,.8,.4,1); }
.statring__fill--success { stroke: var(--success); }

/* ── calendar / history ──────────────────────────────────────────────── */
.hist { margin-top: 32px; }
.hist__head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
.hist__head .streaks__head { margin-bottom: 0; }
.hist__expand { display: inline-flex; align-items: center; gap: 4px; border: 0; background: none; padding: 6px 2px; font: inherit; font-size: .85rem; font-weight: 600; color: var(--accent-2); cursor: pointer; border-radius: var(--radius-sm); white-space: nowrap; }
.hist__expand:hover { text-decoration: underline; }

.monthcard { background: var(--card-bg); border: var(--card-border); border-radius: var(--radius); box-shadow: var(--card-shadow); padding: 16px clamp(14px, 3.5vw, 24px) 18px; max-width: 480px; }
.monthcard--multi { position: relative; max-width: none; padding: 18px clamp(16px, 3vw, 28px) 18px; }
.monthcard__grid { display: grid; gap: 10px 32px; }
.monthcard__arrow { position: absolute; top: 18px; z-index: 1; }
.monthcard__arrow--prev { left: 14px; }
.monthcard__arrow--next { right: 14px; }
.monthcard__nav { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.monthcard__label { font-family: var(--font-display); font-weight: var(--section-weight); font-size: 1.08rem; color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
.histnavbtn { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line-2); background: transparent; color: var(--ink-2); cursor: pointer; transition: background-color .2s, border-color .2s, color .2s; }
.histnavbtn:hover:not(:disabled) { border-color: var(--ink-3); color: var(--ink); background: var(--surface-2); }
.histnavbtn:disabled { opacity: .32; cursor: default; }

.mv__dow { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 7px; }
.mv__dow span { text-align: center; font-size: .66rem; font-weight: 700; letter-spacing: .04em; color: var(--ink-3); }
.mv__grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.mv__title { font-family: var(--font-display); font-weight: var(--section-weight); font-size: 1rem; margin: 0 0 12px; color: var(--ink); text-align: center; }
.monthcard--multi .monthcard__grid { margin: 0 clamp(6px, 2vw, 30px); }

.hist__legend { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 16px; font-size: .74rem; color: var(--ink-3); margin-top: 15px; }
.hist__legend span { display: inline-flex; align-items: center; gap: 6px; }
.hist__legend i { width: 12px; height: 12px; border-radius: 4px; }
.hist__legend i.is-today { box-shadow: inset 0 0 0 2px var(--accent); }

.cal-cell { position: relative; aspect-ratio: 1; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; border: 1px solid transparent; cursor: pointer; background: var(--surface-2); padding: 0; transition: background-color .15s ease, box-shadow .15s ease, transform .08s ease; }
.cal-cell:active:not(:disabled) { transform: scale(.88); }
.cal-cell__num { font-size: .8rem; font-weight: 600; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.cal-cell--done { background: var(--success-soft); }
.cal-cell--done .cal-cell__num { color: var(--success-ink); }
.cal-cell--miss { background: var(--miss-soft); }
.cal-cell--miss .cal-cell__num { color: var(--miss-ink); }
.cal-cell--failtint { background: color-mix(in oklch, var(--miss-soft) 45%, var(--surface-2)); }
.cal-cell--unmarked:hover { background: color-mix(in oklch, var(--accent-soft) 55%, var(--surface-2)); }
.cal-cell--today { box-shadow: inset 0 0 0 2px var(--accent); }
.cal-cell--future { background: transparent; cursor: default; }
.cal-cell--future .cal-cell__num { color: var(--ink-3); opacity: .45; }
.cal-cell--pad { visibility: hidden; pointer-events: none; background: transparent; }

/* full-history sheet */
.histsheet { width: 100%; max-width: 880px; max-height: min(86vh, 780px); background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: 0 24px 60px -16px rgba(0,0,0,.4); display: flex; flex-direction: column; overflow: hidden; animation: pop .2s cubic-bezier(.3,.8,.4,1) both; }
.histsheet__head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 17px 18px 17px 22px; border-bottom: 1px solid var(--line); }
.histsheet__title { display: inline-flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: var(--section-weight); font-size: 1.12rem; color: var(--ink); }
.histsheet__scroll { overflow-y: auto; padding: 4px 22px 26px; -webkit-overflow-scrolling: touch; }
.histsheet__grid { display: grid; grid-template-columns: 1fr; gap: 26px; }
@media (min-width: 560px) { .histsheet__grid { grid-template-columns: 1fr 1fr; gap: 26px 24px; } }
@media (min-width: 840px) { .histsheet__grid { grid-template-columns: 1fr 1fr 1fr; gap: 28px 26px; } }
.histsheet__more { display: grid; place-items: center; padding: 22px 0 6px; font-size: .82rem; color: var(--ink-3); }
.histsheet .mv { padding-top: 14px; }

/* ── best streaks (leaderboard) ──────────────────────────────────────── */
.streaks { margin-top: 32px; }
.streaks__head { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
.streaks__title { font-family: var(--font-display); font-weight: var(--section-weight); font-size: 1.1rem; margin: 0; white-space: nowrap; }
.streaks__card { padding: 12px; }
.streaks__list { display: flex; flex-direction: column; }
.streakrow { display: flex; align-items: center; gap: 14px; padding: 9px 6px; border-radius: var(--radius-sm); }
.streakrow--top { background: color-mix(in oklch, var(--accent-soft) 55%, transparent); }
.streakrow__rank { display: grid; place-items: center; width: 22px; flex: none; font-family: var(--font-display); font-weight: var(--section-weight); font-size: .98rem; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.streakrow--top .streakrow__rank { color: var(--accent-2); }
.streakrow__main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 7px; }
.streakrow__top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.streakrow__range { font-size: .85rem; color: var(--ink-3); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.streakrow__len { display: inline-flex; align-items: baseline; gap: 8px; white-space: nowrap; font-size: .92rem; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
.streakrow__unit { font-weight: 500; color: var(--ink-3); margin-left: 3px; }
.streakrow__track { height: 6px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.streakrow__fill { height: 100%; border-radius: 999px; background: color-mix(in oklch, var(--success) 72%, var(--surface)); }
.streakrow--top .streakrow__fill { background: var(--success); }
.streakrow__fill--current { background: var(--accent); }
.streak__badge { font-size: .62rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 3px 7px; border-radius: var(--radius-pill); background: var(--accent); color: var(--accent-ink); align-self: center; }
.streaks__more { display: inline-flex; align-items: center; gap: 5px; margin: 4px 6px 6px; border: 0; background: none; font: inherit; font-size: .85rem; font-weight: 600; color: var(--accent-2); cursor: pointer; border-radius: var(--radius-sm); }
.streaks__more:hover { text-decoration: underline; }
.streaks__divider { margin: 4px 6px 0; padding-top: 12px; border-top: 1px dashed var(--line-2); }
.streaks__divider .streakrow { padding-left: 0; padding-right: 0; }
.streaks__nudge { font-size: .8rem; color: var(--ink-3); margin: 4px 0 8px; padding-left: 36px; }

/* ── patterns (charts) ───────────────────────────────────────────────── */
.patterns { margin-top: 32px; }
.patterns__head { display: flex; align-items: center; justify-content: space-between; gap: 14px 16px; flex-wrap: wrap; margin-bottom: 16px; }
.patterns__head .streaks__head { margin-bottom: 0; }
.patterns__card { padding: 18px clamp(14px, 3vw, 22px) 16px; }

.pat__insight { margin: 0 0 18px; font-size: .92rem; line-height: 1.45; color: var(--ink-2); text-wrap: pretty; }
.pat__insight strong { color: var(--ink); font-weight: 600; }

.pat__chart { display: grid; grid-template-columns: repeat(var(--cols, 7), minmax(0, 1fr)); gap: clamp(3px, 1.4vw, 14px); align-items: end; }
.pat__col { display: flex; flex-direction: column; min-width: 0; }
.pat__track { height: 154px; display: flex; align-items: flex-end; justify-content: center; padding-top: 24px; }
.pat__bar { position: relative; width: 100%; max-width: 46px; margin: 0 auto; border-radius: var(--radius-sm) var(--radius-sm) 3px 3px;
  background: var(--accent); transition: height .62s cubic-bezier(.3,.85,.35,1); }
.pat__bar--miss { background: var(--miss); }
.pat__bar--empty { background: var(--surface-2); border-radius: 4px 4px 3px 3px; }
.pat__bar--partial { background: repeating-linear-gradient(135deg,
  var(--accent) 0 6px, color-mix(in oklch, var(--accent) 48%, var(--surface)) 6px 12px); }
.pat__bar--miss.pat__bar--partial { background: repeating-linear-gradient(135deg,
  var(--miss) 0 6px, color-mix(in oklch, var(--miss) 48%, var(--surface)) 6px 12px); }

.pat__val { position: absolute; left: 50%; top: -20px; transform: translateX(-50%);
  font-size: .72rem; font-weight: 700; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.pat__bar--empty .pat__val { color: var(--ink-3); }
.pat__bar--miss .pat__val { color: var(--miss-ink); }

.pat__lbl { margin-top: 11px; display: flex; flex-direction: column; align-items: center; gap: 1px;
  font-size: .68rem; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; color: var(--ink-3); white-space: nowrap; }
.pat__col--peak .pat__lbl { color: var(--ink-2); }

.pat__cap { margin: 16px 0 0; padding-top: 12px; border-top: 1px solid var(--line);
  display: flex; align-items: center; gap: 8px 16px; flex-wrap: wrap; font-size: .74rem; color: var(--ink-3); }
.pat__swatch { display: inline-flex; align-items: center; gap: 6px; font-style: normal; }
.pat__swatch::before { content: ''; width: 11px; height: 11px; border-radius: 3px; flex: none;
  background: repeating-linear-gradient(135deg, var(--accent) 0 4px, color-mix(in oklch, var(--accent) 48%, var(--surface)) 4px 8px); }

/* ── dialog ──────────────────────────────────────────────────────────── */
.scrim { position: fixed; inset: 0; z-index: 60; background: oklch(0.2 0.01 65 / 0.42); backdrop-filter: blur(2px); display: grid; place-items: center; padding: 20px; animation: fade .18s ease both; }
.dialog { width: 100%; max-width: 420px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: 0 24px 60px -16px rgba(0,0,0,.4); padding: 24px; animation: pop .2s cubic-bezier(.3,.8,.4,1) both; }
.dialog__title { font-family: var(--font-display); font-weight: var(--section-weight); font-size: 1.2rem; margin: 0; }
.dialog__body { color: var(--ink-2); font-size: .94rem; margin: 10px 0 22px; }
.dialog__actions { display: flex; justify-content: flex-end; gap: 10px; }
@keyframes fade { from { opacity: 0.4; } }
@keyframes pop { from { transform: scale(.97) translateY(6px); } }

/* ── settings ────────────────────────────────────────────────────────── */
.set__group { margin-top: 22px; }
.set__row { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 18px 0; border-bottom: 1px solid var(--line); }
.set__row:last-child { border-bottom: 0; }
.set__row-main { min-width: 0; }
.set__row-label { font-weight: 600; color: var(--ink); }
.set__row-desc { font-size: .84rem; color: var(--ink-3); margin-top: 2px; }

/* ── skeletons ───────────────────────────────────────────────────────── */
.skel { background: linear-gradient(90deg, var(--surface-2) 25%, color-mix(in oklch, var(--surface-2) 60%, var(--bg)) 37%, var(--surface-2) 63%); background-size: 400% 100%; animation: shimmer 1.4s ease infinite; border-radius: var(--radius-sm); }
@keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }

/* ── toast ───────────────────────────────────────────────────────────── */
.toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); z-index: 70; display: flex; align-items: center; gap: 14px; background: var(--ink); color: var(--bg); padding: 13px 16px 13px 18px; border-radius: var(--radius-pill); box-shadow: 0 16px 40px -10px rgba(0,0,0,.5); font-size: .9rem; animation: toastin .26s cubic-bezier(.3,.8,.4,1) both; }
.toast__action { font-weight: 700; color: var(--accent); background: none; border: 0; cursor: pointer; font-size: .9rem; }
@keyframes toastin { from { transform: translate(-50%, 16px); } }

/* Screen entrance: intentionally no animation. An opacity fade renders blank in
   DOM-clone screenshots, and a transform fade leaves <main> a containing block
   that breaks fixed-position overlays (dialogs, toasts, the history sheet).
   The resting state is always fully visible. */
.fadein { animation: none; }

/* ════════════════════════════════════════════════════════════════════════
   REDESIGN — Today dashboard, habit cards, week strip, ring, account menu
   ════════════════════════════════════════════════════════════════════════ */

/* ── account menu (nav) ──────────────────────────────────────────────── */
.acct { position: relative; }
.avatar { display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink-2); font-size: .82rem; font-weight: 700; letter-spacing: .02em; cursor: pointer; font-variant: small-caps; transition: border-color .2s, background-color .2s; }
[data-direction="quiet"] .avatar, [data-direction="editorial"] .avatar { background: var(--accent-soft); color: var(--accent-2); border-color: transparent; }
.avatar:hover { border-color: var(--ink-3); }
.acct__menu { position: absolute; top: calc(100% + 10px); right: 0; z-index: 50; width: 248px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 18px 48px -16px oklch(0.3 0.02 65 / .35); padding: 6px; animation: pop .16s cubic-bezier(.3,.8,.4,1) both; }
[data-theme="dark"] .acct__menu { box-shadow: 0 18px 48px -12px rgba(0,0,0,.6); }
.acct__id { display: flex; align-items: center; gap: 11px; padding: 10px 11px 12px; border-bottom: 1px solid var(--line); margin-bottom: 6px; }
.acct__id .avatar { width: 36px; height: 36px; cursor: default; flex: none; }
.acct__id-main { min-width: 0; }
.acct__id-name { font-weight: 600; font-size: .9rem; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.acct__id-email { font-size: .78rem; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.acct__item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 11px; border: 0; background: none; border-radius: var(--radius-sm); font: inherit; font-size: .9rem; font-weight: 500; color: var(--ink); cursor: pointer; text-align: left; white-space: nowrap; }
.acct__item:hover { background: var(--surface-2); }
.acct__item svg { color: var(--ink-3); }
.acct__item--danger { color: var(--miss-ink); }
.acct__item--danger svg { color: var(--miss-ink); }
.acct__sep { height: 1px; background: var(--line); margin: 6px 4px; }

/* ── Today hero band ─────────────────────────────────────────────────── */
.today { display: flex; align-items: center; justify-content: space-between; gap: 28px; flex-wrap: wrap; }
.today__l { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.today__eyebrow { font-size: .74rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--accent-2); }
.today__title { font-family: var(--font-display); font-weight: var(--title-weight); letter-spacing: var(--letter-display); font-size: clamp(1.9rem, 1.4rem + 2vw, 2.6rem); line-height: 1.05; margin: 0; color: var(--ink); }
.today__title em { font-style: normal; color: var(--accent-2); }
[data-direction="editorial"] .today__title { font-style: italic; }
.today__sub { color: var(--ink-2); font-size: 1rem; }

.today__r { display: flex; align-items: center; gap: 16px; }
.today__count { text-align: right; white-space: nowrap; }
.today__count b { font-family: var(--font-display); font-weight: var(--title-weight); font-size: 1.15rem; color: var(--ink); font-variant-numeric: tabular-nums; line-height: 1; letter-spacing: -.01em; }
.today__count span { display: block; font-size: .8rem; color: var(--ink-3); margin-top: 5px; }

.ring { position: relative; width: 66px; height: 66px; flex: none; }
.ring > svg { transform: rotate(-90deg); display: block; }
.ring__track { fill: none; stroke: var(--surface-2); }
.ring__fill { fill: none; stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .7s cubic-bezier(.3,.8,.4,1); }
.ring__txt { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 700; font-size: .92rem; color: var(--ink); font-variant-numeric: tabular-nums; }
.ring--full .ring__fill { stroke: var(--success); }
.ring--full .ring__txt { color: var(--success-ink); }
.ring__check { color: var(--success); }

/* hairline that splits hero from the day's list */
.today__rule { height: 1px; background: var(--line); margin: 26px 0 4px; }

/* ── section header (Building / Breaking) ────────────────────────────── */
.sect { margin-top: 30px; }
.sect:first-of-type { margin-top: 18px; }
.sect__head { display: flex; align-items: center; gap: 11px; margin-bottom: 14px; }
.sect__dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.sect__dot--pos { background: var(--accent); }
.sect__dot--neg { background: var(--miss); }
.sect__name { font-size: .76rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); }
.sect__count { font-size: .76rem; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.sect__line { flex: 1; height: 1px; background: var(--line); }
.sect__add { display: inline-flex; align-items: center; gap: 4px; flex: none; border: 0; background: none; padding: 4px 2px; font: inherit; font-size: .76rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent-2); cursor: pointer; border-radius: var(--radius-sm); }
.sect__add:hover { text-decoration: underline; }

.cards { display: flex; flex-direction: column; gap: 12px; }

/* ── habit card ──────────────────────────────────────────────────────── */
.hcard { display: flex; align-items: center; gap: 18px; padding: 17px 20px; background: var(--card-bg); border: var(--card-border); border-radius: var(--radius); box-shadow: var(--card-shadow); }
.hcard--done { background: color-mix(in oklch, var(--success-soft) 26%, var(--card-bg)); }
[data-direction="quiet"] .hcard--done, [data-direction="editorial"] .hcard--done { background: color-mix(in oklch, var(--success-soft) 40%, transparent); }
.hcard__body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 11px; background: none; border: 0; padding: 0; text-align: left; color: inherit; cursor: pointer; }
.hcard__action { flex: none; width: 116px; display: flex; align-items: center; justify-content: flex-end; }
@media (max-width: 480px) { .hcard__action { width: 92px; } }
.hcard__name { font-weight: 600; font-size: 1.06rem; color: var(--ink); letter-spacing: -.005em; }
.hcard__body:hover .hcard__name { color: var(--accent-2); }
.hcard__meta { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }

/* week strip — last 7 days */
.wkstrip { display: flex; gap: 5px; }
.wkcell { width: 26px; height: 30px; border-radius: 7px; background: var(--surface-2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.wkcell__dow { font-size: .56rem; font-weight: 700; letter-spacing: .02em; color: var(--ink-3); line-height: 1; text-transform: uppercase; }
.wkcell__mk { width: 5px; height: 5px; border-radius: 50%; background: var(--line-2); }
.wkcell--done { background: var(--success-soft); }
.wkcell--done .wkcell__dow { color: var(--success-ink); }
.wkcell--done .wkcell__mk { background: var(--success); }
.wkcell--miss { background: var(--miss-soft); }
.wkcell--miss .wkcell__dow { color: var(--miss-ink); }
.wkcell--miss .wkcell__mk { background: var(--miss); }
.wkcell--today { box-shadow: inset 0 0 0 1.5px var(--accent); }
@media (max-width: 480px) { .wkcell { width: 22px; height: 26px; } }

/* target pips — weekly / monthly */
.pips { display: inline-flex; align-items: center; gap: 6px; }
.pip { width: 13px; height: 13px; border-radius: 50%; border: 1.5px solid var(--line-2); background: transparent; }
.pip--on { background: var(--success); border-color: var(--success); }

/* streak chip */
.streakc { display: inline-flex; align-items: center; gap: 6px; font-size: .82rem; font-weight: 600; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.streakc svg { color: var(--accent); }
.streakc--cold { color: var(--ink-3); font-weight: 500; }
.streakc--cold svg { color: var(--ink-3); }
.hcard__pmeta { font-size: .82rem; color: var(--ink-3); white-space: nowrap; }

/* round mark control (daily) */
.markdot { width: 48px; height: 48px; border-radius: 50%; border: 2px solid var(--line-2); display: grid; place-items: center; background: transparent; color: var(--ink-3); cursor: pointer; flex: none; transition: transform .18s cubic-bezier(.3,.7,.4,1), background-color .2s, border-color .2s, color .2s; }
.markdot:hover { border-color: var(--accent); color: var(--accent); }
.markdot:active { transform: scale(.92); }
.markdot[data-done="true"] { background: var(--success); border-color: var(--success); color: #fff; }
.markdot[data-done="true"]:hover { filter: brightness(.96); border-color: var(--success); color: #fff; }
.markdot__ico { width: 22px; height: 22px; }
.markdot:not([data-done="true"]) .markdot__ico { opacity: .45; transition: opacity .15s ease; }
.markdot:not([data-done="true"]):hover .markdot__ico { opacity: 1; }

/* pill mark (weekly/monthly) */
.logbtn { display: inline-flex; align-items: center; gap: 7px; flex: none; min-height: 44px; padding: 0 17px; border-radius: var(--radius-pill); font-size: .88rem; font-weight: 600; cursor: pointer; white-space: nowrap; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink-2); transition: background-color .2s, border-color .2s, color .2s; }
[data-direction="quiet"] .logbtn, [data-direction="editorial"] .logbtn { background: transparent; }
.logbtn:hover { border-color: var(--accent); color: var(--accent-2); }
.logbtn[data-met="true"] { background: var(--success-soft); border-color: transparent; color: var(--success-ink); }
.logbtn[disabled] { opacity: .55; cursor: default; }

/* ── detail header (redesigned) ──────────────────────────────────────── */
.detail__bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.detail__head { display: block; margin-top: 18px; margin-bottom: 8px; }
.detail__topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
.detail__meta { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; flex-wrap: wrap; }
.detail__meta .tag__chip { text-transform: uppercase; letter-spacing: .07em; font-size: .7rem; font-weight: 700; padding: 4px 9px; }
.detail__freq { font-size: .7rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
.detail__title { font-size: clamp(1.55rem, 1.2rem + 1.5vw, 2.15rem); line-height: 1.1; }
.detail__actions { display: flex; gap: 8px; flex: none; }
@media (max-width: 520px) {
  .detail__actions .btn span { display: none; }
}

/* add-habit trigger — centered pill, consistent with the rounded language */
.addhabit { display: flex; justify-content: center; margin-top: 30px; }
.addhabit__btn { border-radius: var(--radius-pill); min-height: 46px; padding: 0 24px; }

/* refined back control — pill button, not a web text-link */
.backbtn { display: inline-flex; align-items: center; gap: 7px; font-size: .86rem; font-weight: 600; color: var(--ink-2); background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--radius-pill); padding: 0 15px 0 13px; min-height: 38px; cursor: pointer; white-space: nowrap; transition: background-color .2s, border-color .2s, color .2s; }

.backbtn:hover { border-color: var(--ink-3); color: var(--ink); background: var(--surface-2); }
.backbtn svg { transition: transform .2s ease; }
.backbtn:hover svg { transform: translateX(-2px); }

/* habit actions — kebab menu (replaces the dated Edit/Delete button pair) */
.hmenu { position: relative; flex: none; display: flex; }
.hmenu__trigger { display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink-2); cursor: pointer; transition: background-color .2s, border-color .2s, color .2s; }
[data-direction="quiet"] .hmenu__trigger, [data-direction="editorial"] .hmenu__trigger { background: transparent; }
.hmenu__trigger:hover, .hmenu__trigger[aria-expanded="true"] { border-color: var(--ink-3); color: var(--ink); background: var(--surface-2); }
.hmenu__dots { display: flex; flex-direction: column; gap: 3px; }
.hmenu__dots i { width: 4px; height: 4px; border-radius: 50%; background: currentColor; }

/* ══ landing page ════════════════════════════════════════════════════════ */
.lp { padding-bottom: 0; }
.lp__wide { width: 100%; max-width: 980px; margin: 0 auto; padding: 0 20px; }
.lp-band { width: 100%; }
.lp-band--tint { background: var(--bg-2); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.lp-sec { padding-top: clamp(56px, 9vw, 104px); padding-bottom: clamp(56px, 9vw, 104px); }
.lp-sec--tight { padding-top: clamp(40px, 6vw, 72px); padding-bottom: clamp(40px, 6vw, 72px); }

/* eyebrow + section heads */
.lp-kicker { display: inline-flex; align-items: center; gap: 8px; font-size: .72rem; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--accent-2); }
.lp-kicker::before { content: ""; width: 18px; height: 1.5px; background: currentColor; opacity: .55; }
.lp-h2 { font-family: var(--font-display); font-weight: var(--title-weight); letter-spacing: var(--letter-display); font-size: clamp(1.7rem, 1.2rem + 2vw, 2.5rem); line-height: 1.1; margin: 14px 0 0; color: var(--ink); max-width: 20ch; text-wrap: balance; }
.lp-lead { color: var(--ink-2); font-size: 1.08rem; line-height: 1.55; max-width: 56ch; margin: 16px 0 0; text-wrap: pretty; }
.lp-sec--center { text-align: center; }
.lp-sec--center .lp-h2, .lp-sec--center .lp-lead { margin-left: auto; margin-right: auto; }

/* ── hero ─────────────────────────────────────────────────────────────── */
.lp-hero { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr); gap: clamp(36px, 6vw, 80px); align-items: center; padding: clamp(48px, 8vh, 104px) 0 clamp(40px, 7vw, 80px); }
.lp-hero__title { font-family: var(--font-display); font-weight: var(--title-weight); letter-spacing: var(--letter-display); font-size: clamp(2.3rem, 1.5rem + 3.6vw, 3.7rem); line-height: 1.04; margin: 18px 0 0; color: var(--ink); text-wrap: balance; }
.lp-hero__title em { font-style: normal; color: var(--accent-2); }
.lp-hero__sub { color: var(--ink-2); font-size: clamp(1.05rem, 1rem + .35vw, 1.22rem); line-height: 1.55; max-width: 46ch; margin: 20px 0 0; text-wrap: pretty; }
.lp-cta-row { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 30px; }

.lp-trust svg { color: var(--accent); }

.lp-mock { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: 0 1px 2px oklch(0.4 0.02 65 / .05), 0 30px 60px -34px oklch(0.4 0.03 65 / .4); padding: clamp(18px, 2.4vw, 26px); }

.lp-mock__head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.lp-mock__name { font-weight: 600; font-size: 1.05rem; color: var(--ink); white-space: nowrap; }
.lp-mock__tag { flex: none; font-size: .72rem; font-weight: 600; letter-spacing: .03em; padding: 3px 9px; border-radius: var(--radius-pill); background: var(--accent-soft); color: var(--accent-2); }
.lp-mock__cap { font-size: .82rem; color: var(--ink-3); margin: 0 0 16px; }
.lp-mock .mv__dow { margin-bottom: 8px; }

.lp-mock .cal-cell { cursor: default; }

.lp-mock__leg { display: inline-flex; align-items: center; gap: 7px; font-size: .8rem; color: var(--ink-3); }
.lp-mock__sw { width: 13px; height: 13px; border-radius: 4px; flex: none; }
.lp-mock__sw--done { background: var(--success-soft); box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--success) 30%, transparent); }
.lp-mock__sw--miss { background: var(--miss-soft); box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--miss) 30%, transparent); }
.lp-mock__hint { flex: 1 1 100%; font-size: .86rem; color: var(--ink-2); line-height: 1.45; }

/* ── how it works — steps ─────────────────────────────────────────────── */
.lp-steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(20px, 3vw, 36px); margin-top: 44px; counter-reset: step; }
.lp-step { position: relative; }
.lp-step__n { font-family: var(--font-display); font-size: .82rem; font-weight: 700; letter-spacing: .08em; color: var(--accent-2); display: inline-flex; align-items: center; gap: 9px; }
.lp-step__n::before { counter-increment: step; content: "0" counter(step); font-variant-numeric: tabular-nums; }
.lp-step__t { font-family: var(--font-display); font-weight: var(--section-weight); font-size: 1.18rem; color: var(--ink); margin: 12px 0 0; }
.lp-step__d { color: var(--ink-2); line-height: 1.55; margin: 8px 0 0; font-size: .98rem; }

/* ── two-up: build & break ────────────────────────────────────────────── */
.lp-duo { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(16px, 2.4vw, 24px); margin-top: 44px; }
.lp-modecard { border: var(--card-border); background: var(--card-bg); box-shadow: var(--card-shadow); border-radius: var(--radius-lg); padding: clamp(22px, 3vw, 32px); }

/* ── feature grid ─────────────────────────────────────────────────────── */
.lp-feats { display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(2px, 0.2vw, 4px); margin-top: 48px; border: 1px solid var(--line); border-radius: var(--radius-lg); overflow: hidden; background: var(--line); }

.lp-feat__ico { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-2); }
.lp-feat__t { font-family: var(--font-display); font-weight: var(--section-weight); font-size: 1.1rem; color: var(--ink); margin: 16px 0 0; }
.lp-feat__d { color: var(--ink-2); line-height: 1.55; margin: 8px 0 0; font-size: .96rem; }

/* ── FAQ ──────────────────────────────────────────────────────────────── */
.lp-faq { max-width: 760px; margin: 40px auto 0; }
.lp-faq__item { border-top: 1px solid var(--line); }
.lp-faq__item:last-child { border-bottom: 1px solid var(--line); }
.lp-faq__q { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 16px; text-align: left; background: none; border: 0; padding: 22px 4px; cursor: pointer; color: var(--ink); font-family: var(--font-display); font-weight: var(--section-weight); font-size: 1.08rem; }
.lp-faq__q:hover { color: var(--accent-2); }
.lp-faq__ico { flex: none; color: var(--ink-3); transition: transform .25s ease; }
.lp-faq__item[data-open="true"] .lp-faq__ico { transform: rotate(180deg); color: var(--accent-2); }

.lp-faq__item[data-open="true"] .lp-faq__a { max-height: 260px; }
.lp-faq__a p { margin: 0 4px; padding-bottom: 24px; color: var(--ink-2); line-height: 1.6; max-width: 64ch; }

/* ── final CTA ────────────────────────────────────────────────────────── */
.lp-final { text-align: center; padding-top: clamp(64px, 10vw, 120px); padding-bottom: clamp(64px, 10vw, 120px); }
.lp-final__t { font-family: var(--font-display); font-weight: var(--title-weight); letter-spacing: var(--letter-display); font-size: clamp(2rem, 1.4rem + 2.6vw, 3rem); line-height: 1.08; color: var(--ink); margin: 16px auto 0; max-width: 18ch; text-wrap: balance; }

.lp-foot__inner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 18px; }
.lp-foot__brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.05rem; letter-spacing: -.02em; color: var(--ink); }
[data-direction="editorial"] .lp-foot__brand { font-family: var(--font-serif); font-weight: 600; }
.lp-foot__note { color: var(--ink-3); font-size: .86rem; }

/* ── product showcase / any device ────────────────────────────────────── */
.lp-stage { display: grid; grid-template-columns: 1.45fr 1fr; gap: clamp(16px, 2.4vw, 26px); align-items: center; margin-top: 48px; }
.lp-window { position: relative; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--surface); box-shadow: 0 1px 2px oklch(0.4 0.02 65 / .05), 0 34px 64px -32px oklch(0.4 0.03 65 / .42); }
[data-theme="dark"] .lp-window { box-shadow: 0 1px 2px rgba(0,0,0,.3), 0 34px 64px -32px rgba(0,0,0,.7); }

.lp-window__dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line-2); flex: none; }
.lp-window__url { margin-left: 10px; flex: 1; min-width: 0; height: 24px; border-radius: 7px; background: var(--bg); border: 1px solid var(--line); font-size: .72rem; color: var(--ink-3); display: flex; align-items: center; gap: 7px; padding: 0 11px; overflow: hidden; white-space: nowrap; }
.lp-window__url svg { flex: none; color: var(--accent); }
.lp-window img { display: block; width: 100%; height: auto; }
.lp-window--sm { align-self: flex-end; }
.lp-synced { position: absolute; right: 14px; bottom: 14px; display: inline-flex; align-items: center; gap: 7px; font-size: .8rem; font-weight: 600; color: var(--accent-2); background: color-mix(in oklch, var(--surface) 86%, transparent); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border: 1px solid var(--line); border-radius: var(--radius-pill); padding: 6px 12px; box-shadow: 0 6px 18px -10px oklch(0.4 0.03 65 / .4); }
.lp-devs { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 26px; }
.lp-dev { display: inline-flex; align-items: center; gap: 8px; font-size: .88rem; font-weight: 500; color: var(--ink-2); border: 1px solid var(--line-2); border-radius: var(--radius-pill); padding: 8px 15px; background: var(--surface); }
[data-direction="quiet"] .lp-dev, [data-direction="editorial"] .lp-dev { background: transparent; }
.lp-dev svg { color: var(--accent); }
.lp-dev__glyph { display: inline-block; border: 1.5px solid currentColor; color: var(--accent); flex: none; }
.lp-dev__glyph--laptop { width: 22px; height: 14px; border-radius: 3px; position: relative; }
.lp-dev__glyph--laptop::after { content: ""; position: absolute; left: -4px; right: -4px; bottom: -3px; height: 2px; border-radius: 2px; background: currentColor; }

.lp-dev__glyph--phone { width: 11px; height: 19px; border-radius: 3px; }

@media (max-width: 860px) {
  .lp-hero { grid-template-columns: 1fr; text-align: center; }
  .lp-hero__sub { margin-left: auto; margin-right: auto; }
  .lp-cta-row, .lp-trust { justify-content: center; }
  .lp-mock { max-width: 460px; margin: 4px auto 0; }
  .lp-feats { grid-template-columns: 1fr 1fr; }
  .lp-duo { grid-template-columns: 1fr; }
  .lp-stage { grid-template-columns: 1fr; max-width: 560px; margin-left: auto; margin-right: auto; }
}

  .lp-steps { grid-template-columns: 1fr; gap: 28px; }
  .lp-feats { grid-template-columns: 1fr; }
}

  <script src="74afc55e-8cad-43e8-beb5-fd7570057c52" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="8ed4859d-9f69-485a-beb5-0a3c0c5ba826" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="9ff13bb4-4974-4b40-b5d3-9a891c9c40ac" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script>
/* habitpair — mock data engine (plain JS, loaded before React).
   Generates believable daily/weekly history with clustered misses, then derives
   list progress, calendar coloring, and insight metrics from the live marks so
   everything stays internally consistent as the user toggles days. */
(function () {
  'use strict';

  const TODAY = '2026-06-04';
  const MS = 86400000;

  // ── date utils (all local, no UTC drift) ─────────────────────────────────
  const parseISO = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const toISO = (dt) => `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
  const addDays = (dt, n) => new Date(dt.getFullYear(), dt.getMonth(), dt.getDate() + n);
  const dowMon = (dt) => (dt.getDay() + 6) % 7;            // 0 = Monday
  const weekStart = (dt) => addDays(dt, -dowMon(dt));
  const monthStartOf = (dt) => new Date(dt.getFullYear(), dt.getMonth(), 1);
  const monthKey = (dt) => `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}`;
  const diffDays = (a, b) => Math.round((parseISO(a) - parseISO(b)) / MS);

  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ── generation ───────────────────────────────────────────────────────────
  // Markov good/bad mood → clustered misses → realistic streak distribution.
  function genDaily(seed, startISO, missRate) {
    const rnd = mulberry32(seed);
    const marks = {};
    let d = parseISO(startISO);
    const end = parseISO(TODAY);
    let bad = false;
    while (d <= end) {
      if (bad) { if (rnd() < 0.45) bad = false; }
      else { if (rnd() < missRate * 0.55) bad = true; }
      const p = bad ? 0.62 : missRate * 0.45;
      marks[toISO(d)] = rnd() < p ? 'MISSED' : 'COMPLETED';
      d = addDays(d, 1);
    }
    return marks;
  }

  function forceRecent(marks, completedTail, missAt) {
    // last `completedTail` days COMPLETED, one MISSED just before → clean streak.
    for (let i = 0; i < completedTail; i++) marks[toISO(addDays(parseISO(TODAY), -i))] = 'COMPLETED';
    if (missAt != null) marks[toISO(addDays(parseISO(TODAY), -missAt))] = 'MISSED';
  }

  function genWeekly(seed, startISO, target) {
    const rnd = mulberry32(seed);
    const marks = {};
    let w = weekStart(parseISO(startISO));
    const today = parseISO(TODAY);
    const thisWeek = weekStart(today);
    while (w <= thisWeek) {
      const isCurrent = +w === +thisWeek;
      // how many sessions this week (0..3), biased to hit target
      let sessions;
      const roll = rnd();
      if (isCurrent) sessions = 1;                          // "1 of 2 this week"
      else if (roll < 0.62) sessions = target;
      else if (roll < 0.82) sessions = target + 1;
      else if (roll < 0.92) sessions = Math.max(0, target - 1);
      else sessions = 0;
      const slots = [0, 1, 2, 3, 4, 5, 6].filter((dd) => +addDays(w, dd) <= +today);
      // shuffle slots
      for (let i = slots.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [slots[i], slots[j]] = [slots[j], slots[i]]; }
      slots.slice(0, Math.min(sessions, slots.length)).forEach((dd) => { marks[toISO(addDays(w, dd))] = 'COMPLETED'; });
      w = addDays(w, 7);
    }
    return marks;
  }

  const SEEDS = [
    { id: 'h_outside', name: 'Outside activity (30 min+)', modality: 'POSITIVE', frequency: 'DAILY', start: '2026-01-05', miss: 0.18, seed: 1107, tail: 3 },
    { id: 'h_read', name: 'Read a book (30 min+)', modality: 'POSITIVE', frequency: 'DAILY', start: '2025-09-01', miss: 0.24, seed: 2208, tail: 2, missAt: 2 },
    { id: 'h_polish', name: 'Polish language (30 min+)', modality: 'POSITIVE', frequency: 'DAILY', start: '2025-11-10', miss: 0.28, seed: 3309, tail: 4, missAt: 4 },
    { id: 'h_gym', name: 'GYM', modality: 'POSITIVE', frequency: 'WEEKLY', target: 2, start: '2025-10-06', seed: 4410 },
    { id: 'h_sugar', name: 'Added sugar', modality: 'NEGATIVE', frequency: 'DAILY', start: '2025-12-01', miss: 0.16, seed: 5511, tail: 6, missAt: 6 },
    { id: 'h_addiction', name: 'Some addiction', modality: 'NEGATIVE', frequency: 'DAILY', start: '2023-11-01', miss: 0.13, seed: 6612, tail: 5, missAt: 5 },
    { id: 'h_news', name: 'No news & YouTube', modality: 'NEGATIVE', frequency: 'DAILY', start: '2026-02-01', miss: 0.30, seed: 7713, tail: 1, missAt: 1 },
  ];

  function seedHabits() {
    return SEEDS.map((s) => {
      let marks;
      if (s.frequency === 'WEEKLY') {
        marks = genWeekly(s.seed, s.start, s.target);
      } else {
        marks = genDaily(s.seed, s.start, s.miss);
        forceRecent(marks, s.tail, s.missAt);
        marks[TODAY] = 'COMPLETED';
      }
      return {
        id: s.id, name: s.name, modality: s.modality, frequency: s.frequency,
        targetCount: s.target ?? null, start: s.start, marks,
      };
    });
  }

  // ── period model ───────────────────────────────────────────────────────────
  const UNIT = { DAILY: 'DAY', WEEKLY: 'WEEK', MONTHLY: 'MONTH' };
  const WINDOW = { DAY: 30, WEEK: 8, MONTH: 6 };

  function firstMarkDate(habit) {
    const keys = Object.keys(habit.marks).filter((k) => habit.marks[k] === 'COMPLETED' || habit.marks[k] === 'MISSED');
    if (!keys.length) return null;
    return keys.sort()[0];
  }

  // Build ordered periods oldest→newest from firstMark→today.
  function buildPeriods(habit) {
    const first = firstMarkDate(habit) || habit.start;
    if (!first) return [];
    const today = parseISO(TODAY);
    const periods = [];
    if (habit.frequency === 'DAILY') {
      let d = parseISO(first);
      while (d <= today) {
        const iso = toISO(d);
        const mark = habit.marks[iso];
        const success = mark === 'COMPLETED';
        const counted = mark === 'COMPLETED' || mark === 'MISSED';
        if (counted) periods.push({ start: iso, end: iso, success, completedCount: success ? 1 : 0, target: 1, closed: true });
        d = addDays(d, 1);
      }
    } else {
      const target = habit.targetCount || 1;
      const stepWeek = habit.frequency === 'WEEKLY';
      let p = stepWeek ? weekStart(parseISO(first)) : monthStartOf(parseISO(first));
      while (p <= today) {
        const end = stepWeek ? addDays(p, 6) : new Date(p.getFullYear(), p.getMonth() + 1, 0);
        let count = 0;
        let d = new Date(p);
        while (d <= end) { if (habit.marks[toISO(d)] === 'COMPLETED') count++; d = addDays(d, 1); }
        const closed = end < today;
        periods.push({ start: toISO(p), end: toISO(end > today ? today : end), success: count >= target, completedCount: count, target, closed });
        p = stepWeek ? addDays(p, 7) : new Date(p.getFullYear(), p.getMonth() + 1, 1);
      }
    }
    return periods;
  }

  function clampEnd(iso) { return diffDays(iso, TODAY) > 0 ? TODAY : iso; }

  function computeMetrics(habit) {
    const unit = UNIT[habit.frequency];
    const periods = buildPeriods(habit);
    if (!periods.length) return { unit, currentStreak: 0, currentRun: null, rollingConsistency: frac(0, 0), recentCompletion: { ...frac(0, 0), phase: 'RATIO' }, bestStreaks: [] };

    // current streak (skip a trailing open, not-yet-successful period)
    let i = periods.length - 1;
    if (periods[i] && !periods[i].closed && !periods[i].success) i--;
    let streak = 0, runStart = null, runEnd = null;
    while (i >= 0 && periods[i].success) { streak++; if (!runEnd) runEnd = periods[i].end; runStart = periods[i].start; i--; }
    const currentRun = streak > 0 ? { start: runStart, end: clampEnd(runEnd), length: streak } : null;

    // best streaks
    const runs = [];
    let cs = null;
    periods.forEach((p) => {
      if (p.success) { if (!cs) cs = { start: p.start, end: p.end, length: 0 }; cs.length++; cs.end = p.end; }
      else if (cs) { runs.push(cs); cs = null; }
    });
    if (cs) runs.push(cs);
    runs.forEach((r) => { r.end = clampEnd(r.end); });
    runs.sort((a, b) => b.length - a.length || (a.end < b.end ? 1 : -1));
    const bestStreaks = runs.slice(0, 10);

    // rolling consistency (closed periods in window)
    const closed = periods.filter((p) => p.closed);
    const win = closed.slice(-WINDOW[unit]);
    const rc = frac(win.filter((p) => p.success).length, win.length);

    // completion (all closed): ratio for first 14, then percent
    const num = closed.filter((p) => p.success).length;
    const recentCompletion = { ...frac(num, closed.length), phase: closed.length <= 14 ? 'RATIO' : 'PERCENT' };

    return { unit, currentStreak: streak, currentRun, rollingConsistency: rc, recentCompletion, bestStreaks };
  }

  function frac(n, d) { return { numerator: n, denominator: d, percent: d === 0 ? null : Math.round((n / d) * 100) }; }

  function computeListItem(habit) {
    const periods = buildPeriods(habit);
    const last = periods[periods.length - 1];
    if (habit.frequency === 'DAILY') {
      return { ...stripHabit(habit), todayStatus: habit.marks[TODAY] || null, currentPeriod: { kind: 'DAILY', completedCount: last && last.success ? 1 : 0, target: 1 } };
    }
    return { ...stripHabit(habit), todayStatus: null, currentPeriod: { kind: habit.frequency, completedCount: last ? last.completedCount : 0, target: habit.targetCount || 1 } };
  }

  function stripHabit(h) { return { id: h.id, name: h.name, modality: h.modality, frequency: h.frequency, targetCount: h.targetCount }; }

  // Calendar: marks + per-period failure tint, oldest→newest months in [from,to].
  function computeCalendar(habit, fromMonth, toMonth) {
    const periods = buildPeriods(habit);
    const failedPeriods = (habit.frequency === 'DAILY') ? [] : periods.filter((p) => p.closed && !p.success).map((p) => ({ start: p.start, end: p.end }));
    return { habit: stripHabit(habit), firstMarkDate: firstMarkDate(habit), marks: habit.marks, failedPeriods };
  }

  window.HP = {
    TODAY, MS, parseISO, toISO, addDays, dowMon, weekStart, monthStartOf, monthKey, diffDays,
    seedHabits, computeMetrics, computeListItem, computeCalendar, firstMarkDate, buildPeriods, UNIT,
  };
})();
