// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-omelette-chrome=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

  </script>

  <script type="text/babel" data-presets="react" data-src="calendar.jsx">
/* habitpair — calendar / history (centerpiece). A single focused month with
   calm inline navigation, plus a lazy-loading full-history sheet. */
const { useMemo: useMemoCal, useState: useStateCal, useRef: useRefCal, useEffect: useEffectCal } = React;

const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MONTH_ABBR = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOW = ['Mo','Tu','We','Th','Fr','Sa','Su'];

const mIdx = (m) => { const [y, mo] = m.split('-').map(Number); return y * 12 + (mo - 1); };
const idxM = (i) => `${Math.floor(i / 12)}-${String((i % 12) + 1).padStart(2, '0')}`;

function monthsBetween(from, to) {
  const out = [];
  for (let i = mIdx(from); i <= mIdx(to); i++) out.push(idxM(i));
  return out;
}

function buildFailSet(failedPeriods) {
  const s = new Set();
  (failedPeriods || []).forEach((p) => {
    let d = HP.parseISO(p.start); const end = HP.parseISO(p.end);
    while (d <= end) { s.add(HP.toISO(d)); d = HP.addDays(d, 1); }
  });
  return s;
}

function MonthView({ ym, marks, failSet, onCycle, showTitle }) {
  const [y, mo] = ym.split('-').map(Number);
  const first = new Date(y, mo - 1, 1);
  const lead = (first.getDay() + 6) % 7;            // Monday-first padding
  const days = new Date(y, mo, 0).getDate();
  const cells = [];
  for (let i = 0; i < lead; i++) cells.push(<div key={`p${i}`} className="cal-cell cal-cell--pad" />);
  for (let d = 1; d <= days; d++) {
    const iso = `${ym}-${String(d).padStart(2, '0')}`;
    const cmp = HP.diffDays(iso, HP.TODAY);
    const future = cmp > 0;
    const isToday = cmp === 0;
    const mark = marks[iso];
    let cls = 'cal-cell ';
    if (future) cls += 'cal-cell--future';
    else if (mark === 'COMPLETED') cls += 'cal-cell--done';
    else if (mark === 'MISSED') cls += 'cal-cell--miss';
    else if (failSet.has(iso)) cls += 'cal-cell--failtint cal-cell--unmarked';
    else cls += 'cal-cell--unmarked';
    if (isToday) cls += ' cal-cell--today';
    cells.push(
      <button key={iso} type="button" className={cls}
        disabled={future}
        aria-label={`${MONTH_ABBR[mo - 1]} ${d}${mark ? ', ' + mark.toLowerCase() : ''}`}
        onClick={() => !future && onCycle(iso)}>
        <span className="cal-cell__num">{d}</span>
      </button>
    );
  }
  return (
    <div className="mv">
      {showTitle ? <h4 className="mv__title">{MONTH_NAMES[mo - 1]} {y}</h4> : null}
      <div className="mv__dow">{DOW.map((d) => <span key={d}>{d}</span>)}</div>
      <div className="mv__grid">{cells}</div>
    </div>
  );
}

function CalLegend() {
  return (
    <div className="hist__legend">
      <span><i style={{ background: 'var(--success-soft)' }} /> Done</span>
      <span><i style={{ background: 'var(--miss-soft)' }} /> Missed</span>
      <span><i className="is-today" /> Today</span>
    </div>
  );
}

function HistorySheet({ months, marks, failSet, onCycle, onClose }) {
  const [count, setCount] = useStateCal(() => Math.min(months.length, 6));
  const sentinel = useRefCal(null);

  useEffectCal(() => {
    const el = sentinel.current;
    if (!el || count >= months.length) return;
    const io = new IntersectionObserver((entries) => {
      if (entries[0].isIntersecting) setCount((c) => Math.min(months.length, c + 6));
    }, { root: el.closest('.histsheet__scroll'), rootMargin: '240px' });
    io.observe(el);
    return () => io.disconnect();
  }, [count, months.length]);

  useEffectCal(() => {
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  const shown = months.slice(0, count);
  return (
    <div className="scrim" onClick={onClose}>
      <div className="histsheet" onClick={(e) => e.stopPropagation()} role="dialog" aria-modal="true" aria-label="Full history">
        <div className="histsheet__head">
          <span className="histsheet__title"><Icon name="cal" size={18} style={{ color: 'var(--accent)' }} /> Full history</span>
          <button className="icon-btn" aria-label="Close" onClick={onClose}><Icon name="x" size={16} /></button>
        </div>
        <div className="histsheet__scroll">
          <CalLegend />
          <div className="histsheet__grid" style={{ marginTop: 14 }}>
            {shown.map((ym) => (
              <MonthView key={ym} ym={ym} marks={marks} failSet={failSet} onCycle={onCycle} showTitle />
            ))}
          </div>
          {count < months.length ? <div ref={sentinel} className="histsheet__more">Loading earlier months…</div> : null}
        </div>
      </div>
    </div>
  );
}

function HabitCalendar({ data, endMonth, setEndMonth, onCycle }) {
  const { marks, firstMarkDate, failedPeriods } = data;
  const failSet = useMemoCal(() => buildFailSet(failedPeriods), [failedPeriods]);
  const [sheetOpen, setSheetOpen] = useStateCal(false);
  const [cols, setCols] = useStateCal(() => calcCols());
  useEffectCal(() => {
    const on = () => setCols(calcCols());
    window.addEventListener('resize', on);
    return () => window.removeEventListener('resize', on);
  }, []);

  const curYm = HP.TODAY.slice(0, 7);
  const curIdx = mIdx(curYm);
  const minIdx = Math.max(curIdx - 47, firstMarkDate ? mIdx(firstMarkDate.slice(0, 7)) : curIdx);
  const endIdx = Math.min(curIdx, Math.max(minIdx, mIdx(endMonth)));
  let startIdx = Math.max(minIdx, endIdx - (cols - 1));
  // near the start of history, slide the window forward so it stays full when possible
  let realEnd = endIdx;
  if (realEnd - startIdx < cols - 1) realEnd = Math.min(curIdx, startIdx + (cols - 1));
  const shownIdxs = [];
  for (let i = startIdx; i <= realEnd; i++) shownIdxs.push(i);
  const single = shownIdxs.length === 1;

  const step = (delta) => setEndMonth(idxM(Math.min(curIdx, Math.max(minIdx, endIdx + delta))));
  const allMonths = useMemoCal(() => monthsBetween(idxM(minIdx), curYm).reverse(), [minIdx, curYm]);

  return (
    <section className="hist">
      <div className="hist__head">
        <div className="streaks__head">
          <Icon name="cal" size={17} style={{ color: 'var(--accent)' }} />
          <h3 className="streaks__title">History</h3>
        </div>
        {firstMarkDate != null ? (
          <button className="hist__expand" onClick={() => setSheetOpen(true)}>
            View full history <Icon name="chevR" size={14} />
          </button>
        ) : null}
      </div>

      {firstMarkDate == null ? (
        <p className="muted" style={{ fontSize: '.9rem', marginTop: 0 }}>No marks yet. Tap a day to start tracking.</p>
      ) : null}

      <div className={`monthcard${single ? '' : ' monthcard--multi'}`}>
        {single ? (
          <>
            <div className="monthcard__nav">
              <button className="histnavbtn" aria-label="Previous month" disabled={startIdx <= minIdx} onClick={() => step(-1)}>
                <Icon name="chevL" size={16} />
              </button>
              <span className="monthcard__label">{MONTH_NAMES[realEnd % 12]} {Math.floor(realEnd / 12)}</span>
              <button className="histnavbtn" aria-label="Next month" disabled={realEnd >= curIdx} onClick={() => step(1)}>
                <Icon name="chevR" size={16} />
              </button>
            </div>
            <MonthView ym={idxM(realEnd)} marks={marks} failSet={failSet} onCycle={onCycle} />
          </>
        ) : (
          <>
            <button className="histnavbtn monthcard__arrow monthcard__arrow--prev" aria-label="Earlier months"
              disabled={startIdx <= minIdx} onClick={() => step(-1)}><Icon name="chevL" size={16} /></button>
            <button className="histnavbtn monthcard__arrow monthcard__arrow--next" aria-label="Later months"
              disabled={realEnd >= curIdx} onClick={() => step(1)}><Icon name="chevR" size={16} /></button>
            <div className="monthcard__grid" style={{ gridTemplateColumns: `repeat(${shownIdxs.length}, 1fr)` }}>
              {shownIdxs.map((i) => (
                <MonthView key={idxM(i)} ym={idxM(i)} marks={marks} failSet={failSet} onCycle={onCycle} showTitle />
              ))}
            </div>
          </>
        )}
        <CalLegend />
      </div>

      {sheetOpen ? (
        <HistorySheet months={allMonths} marks={marks} failSet={failSet} onCycle={onCycle} onClose={() => setSheetOpen(false)} />
      ) : null}
    </section>
  );
}

function calcCols() {
  const w = window.innerWidth;
  if (w >= 980) return 3;
  if (w >= 640) return 2;
  return 1;
}

/* ── Patterns (charts) — completion by weekday, month, and year, so the user
   can see the rhythm behind the marks. Period is chosen with a segmented
   control; the choice persists. Bars and labels pull entirely from theme
   tokens, so they follow dark mode, accent, and direction automatically. */
const PAT_VIEWS = [
  { value: 'weekday', label: 'Weekday' },
  { value: 'month', label: 'Month' },
  { value: 'year', label: 'Year' },
];
const DOW_FULL = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];

const patLs = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};

// Aggregate the raw marks once. For DAILY habits every day carries a
// COMPLETED/MISSED verdict, so weekday becomes a true completion rate. Weekly
// and monthly habits only record the days they showed up, so we count sessions.
function computePatterns(habit) {
  const isDaily = habit.frequency === 'DAILY';
  const marks = habit.marks || {};
  const keys = Object.keys(marks).filter((k) => marks[k] === 'COMPLETED' || marks[k] === 'MISSED');
  const wd = Array.from({ length: 7 }, () => ({ done: 0, total: 0 }));
  const moy = Array.from({ length: 12 }, () => ({ done: 0, total: 0 }));
  const yearMap = new Map();
  keys.forEach((iso) => {
    const done = marks[iso] === 'COMPLETED';
    const dt = HP.parseISO(iso);
    const b = wd[HP.dowMon(dt)]; b.total++; if (done) b.done++;
    const mb = moy[dt.getMonth()]; mb.total++; if (done) mb.done++;
    const yk = iso.slice(0, 4);
    if (!yearMap.has(yk)) yearMap.set(yk, { done: 0, total: 0 });
    const yr = yearMap.get(yk); yr.total++; if (done) yr.done++;
  });
  const sorted = keys.slice().sort();
  return { isDaily, wd, moy, yearMap, first: sorted[0] || null, last: sorted[sorted.length - 1] || null };
}

function buildPatView(pat, view) {
  let bars = [];
  let rateMode = false;
  // A period counts as "partial" when the tracked span doesn't fully cover it,
  // so a habit started Dec 31 doesn't show that year (or month) as a clean 100%.
  // ISO date strings compare chronologically, so plain string compares are safe.
  const lastDay = (Y, M1) => String(new Date(Y, M1, 0).getDate()).padStart(2, '0');
  const yearFull = (Y) => pat.first != null && pat.first <= `${Y}-01-01` && pat.last >= `${Y}-12-31`;
  const monthFull = (M1) => {       // M1 = 1..12 — true if any full calendar instance is covered
    if (pat.first == null) return false;
    const mm = String(M1).padStart(2, '0');
    for (let Y = +pat.first.slice(0, 4); Y <= +pat.last.slice(0, 4); Y++) {
      if (pat.first <= `${Y}-${mm}-01` && pat.last >= `${Y}-${mm}-${lastDay(Y, M1)}`) return true;
    }
    return false;
  };
  if (view === 'weekday') {
    rateMode = pat.isDaily;
    bars = pat.wd.map((b, i) => {
      const rate = b.total ? b.done / b.total : 0;
      return {
        key: 'w' + i, lbl: DOW[i], full: DOW_FULL[i], has: b.total > 0,
        value: rateMode ? rate : b.done,
        display: rateMode ? (b.total ? Math.round(rate * 100) + '%' : '–') : String(b.done),
        tip: rateMode ? `${DOW_FULL[i]} · ${b.done} of ${b.total} completed`
                      : `${DOW_FULL[i]} · ${b.done} session${b.done === 1 ? '' : 's'}`,
        partial: false,
      };
    });
  } else if (view === 'month') {
    rateMode = pat.isDaily;
    bars = pat.moy.map((b, i) => {
      const rate = b.total ? b.done / b.total : 0;
      return {
        key: 'm' + i, lbl: MONTH_ABBR[i], full: MONTH_NAMES[i], has: b.total > 0,
        value: rateMode ? rate : b.done,
        display: b.total ? (rateMode ? Math.round(rate * 100) + '%' : String(b.done)) : '\u2013',
        tip: rateMode ? `${MONTH_NAMES[i]} · ${b.done} of ${b.total} completed (all years)`
                      : `${MONTH_NAMES[i]} · ${b.done} session${b.done === 1 ? '' : 's'} (all years)`,
        partial: b.total > 0 && !monthFull(i + 1),
      };
    });
  } else {
    rateMode = pat.isDaily;
    const years = [...pat.yearMap.keys()].sort();
    bars = years.map((yk) => {
      const b = pat.yearMap.get(yk);
      const rate = b.total ? b.done / b.total : 0;
      return {
        key: yk, lbl: yk, full: yk, has: b.total > 0,
        value: rateMode ? rate : b.done,
        display: b.total ? (rateMode ? Math.round(rate * 100) + '%' : String(b.done)) : '\u2013',
        tip: rateMode ? `${yk} · ${b.done} of ${b.total} completed`
                      : `${yk} · ${b.done} session${b.done === 1 ? '' : 's'}`,
        partial: !yearFull(+yk),
      };
    });
  }
  const max = rateMode ? 1 : Math.max(1, ...bars.map((b) => b.value));
  bars.forEach((b) => { b.frac = max ? b.value / max : 0; });

  // Only complete periods are eligible to be called strongest/weakest — a partial
  // first or current period shouldn't win or lose the comparison on thin data.
  const solid = bars.filter((b) => b.has && !b.partial);
  // Surface the recurring slip slot — weakest weekday / month for daily habits.
  // (Not years: a year is a trajectory point, not a recurring pattern to fix.)
  if (rateMode && (view === 'weekday' || view === 'month') && solid.length >= 2) {
    const lo = solid.reduce((a, b) => (b.value < a.value ? b : a));
    const hi = solid.reduce((a, b) => (b.value > a.value ? b : a));
    if (lo.value < hi.value) lo.tone = 'miss';
  }
  // Mark the peak so its label reads a touch stronger.
  if (solid.length) {
    const peak = solid.reduce((a, b) => (b.value > a.value ? b : a));
    peak.peak = true;
  }
  return { bars, rateMode, hasPartial: bars.some((b) => b.partial) };
}

function patInsight(view, vd) {
  const solid = vd.bars.filter((b) => b.has && !b.partial);
  const withData = solid.length ? solid : vd.bars.filter((b) => b.has);
  if (!withData.length) return null;
  if (vd.rateMode) {
    const sorted = [...withData].sort((a, b) => a.value - b.value);
    const worst = sorted[0], best = sorted[sorted.length - 1];
    if (view === 'year') {
      if (sorted.length < 2 || worst.value === best.value)
        return <><strong>{best.full}</strong>: {best.display} completion.</>;
      return <>Most consistent in <strong>{best.full}</strong> ({best.display}); least in <strong>{worst.full}</strong> ({worst.display}).</>;
    }
    const prep = view === 'weekday' ? 'on' : 'in';
    if (sorted.length < 2 || worst.value === best.value)
      return <>You complete <strong>{best.display}</strong> {view === 'weekday' ? `of ${best.full}s` : `in ${best.full}`}.</>;
    return <>Strongest {prep} <strong>{best.full}</strong> ({best.display}); you slip most {prep} <strong>{worst.full}</strong> ({worst.display}).</>;
  }
  const top = [...withData].sort((a, b) => b.value - a.value)[0];
  if (view === 'weekday') return <>Most often a <strong>{top.full}</strong> — {top.display} session{top.value === 1 ? '' : 's'} logged.</>;
  if (view === 'month') return <>Most active in <strong>{top.full}</strong> — {top.display} session{top.value === 1 ? '' : 's'} logged.</>;
  return <>Strongest year: <strong>{top.full}</strong>, with {top.display} completed.</>;
}

function HabitPatterns({ habit, firstMark }) {
  if (firstMark == null) return null;
  const pat = useMemoCal(() => computePatterns(habit), [habit]);
  const [view, setView] = useStateCal(() => {
    const v = patLs.get('hp_pat_view', 'weekday');
    return PAT_VIEWS.some((p) => p.value === v) ? v : 'weekday';
  });
  const setV = (v) => { setView(v); patLs.set('hp_pat_view', v); };
  const vd = useMemoCal(() => buildPatView(pat, view), [pat, view]);
  const insight = useMemoCal(() => patInsight(view, vd), [view, vd]);

  const metricLabel = view === 'month'
    ? (vd.rateMode ? 'Completion rate by month · all years' : 'Sessions by month · all years')
    : view === 'weekday'
    ? (vd.rateMode ? 'Completion rate by weekday' : 'Sessions logged by weekday')
    : (vd.rateMode ? 'Completion rate by year' : 'Sessions completed per year');

  return (
    <section className="patterns">
      <div className="patterns__head">
        <div className="streaks__head">
          <Icon name="spark" size={17} style={{ color: 'var(--accent)' }} />
          <h3 className="streaks__title">Patterns</h3>
        </div>
        <Segmented value={view} options={PAT_VIEWS} onChange={setV} ariaLabel="Chart period" />
      </div>
      <div className="card patterns__card">
        {insight ? <p className="pat__insight">{insight}</p> : null}
        <div className="pat__chart" style={{ '--cols': vd.bars.length }}>
          {vd.bars.map((b) => {
            const h = Math.max(b.has ? 6 : 0, Math.round(b.frac * 130));
            let cls = 'pat__bar';
            if (!b.has) cls += ' pat__bar--empty';
            if (b.tone === 'miss') cls += ' pat__bar--miss';
            if (b.partial) cls += ' pat__bar--partial';
            return (
              <div key={b.key} className={`pat__col${b.peak ? ' pat__col--peak' : ''}`} title={b.tip}>
                <div className="pat__track">
                  <div className={cls} style={{ height: h + 'px' }}>
                    <span className="pat__val">{b.display}</span>
                  </div>
                </div>
                <div className="pat__lbl">{b.lbl}</div>
              </div>
            );
          })}
        </div>
        <p className="pat__cap">
          <span>{metricLabel}</span>
          {vd.hasPartial ? <i className="pat__swatch">Partial</i> : null}
        </p>
      </div>
    </section>
  );
}

  </script>

const DOW_LETTER = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
const STREAK_UNIT = { DAY: 'd', WEEK: 'w', MONTH: 'mo' };
const STREAK_NOUN = { DAY: 'day', WEEK: 'week', MONTH: 'month' };

// last 7 calendar days ending today (oldest → newest)
function last7(marks) {
  const out = [];
  for (let i = 6; i >= 0; i--) {
    const d = HP.addDays(HP.parseISO(HP.TODAY), -i);
    const iso = HP.toISO(d);
    out.push({ iso, dow: DOW_LETTER[d.getDay()], status: marks[iso] || null, today: i === 0 });
  }
  return out;
}

function Ring({ value, total, size = 66, stroke = 6 }) {
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const pct = total > 0 ? Math.min(1, value / total) : 0;
  const full = total > 0 && value >= total;
  return (
    <div className={`ring${full ? ' ring--full' : ''}`} style={{ width: size, height: size }}>
      <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
        <circle className="ring__track" cx={size / 2} cy={size / 2} r={r} strokeWidth={stroke} />
        <circle className="ring__fill" cx={size / 2} cy={size / 2} r={r} strokeWidth={stroke}
          strokeDasharray={c} strokeDashoffset={c * (1 - pct)} />
      </svg>
      {full ? (
        <div className="ring__txt"><Icon name="check" size={size * 0.34} className="ring__check" /></div>
      ) : null}
    </div>
  );
}

function StreakChip({ streak, unit }) {
  const cold = !streak;
  return (
    <span className={`streakc${cold ? ' streakc--cold' : ''}`}
      title={cold ? 'No active streak' : `${streak} ${STREAK_NOUN[unit]}${streak === 1 ? '' : 's'} streak`}>
      <Icon name="flame" size={15} />
      {cold ? 'No streak' : `${streak}${STREAK_UNIT[unit]}`}
    </span>
  );
}

function WeekStrip({ marks }) {
  return (
    <div className="wkstrip" aria-hidden="true">
      {last7(marks).map((d) => {
        const cls = d.status === 'COMPLETED' ? 'wkcell--done' : d.status === 'MISSED' ? 'wkcell--miss' : '';
        return (
          <span key={d.iso} className={`wkcell ${cls}${d.today ? ' wkcell--today' : ''}`} title={d.iso}>
            <span className="wkcell__dow">{d.dow}</span>
            <span className="wkcell__mk" />
          </span>
        );
      })}
    </div>
  );
}

function HabitCard({ habit, onOpen, onMark, pending }) {
  const daily = habit.frequency === 'DAILY';
  const cp = habit.currentPeriod;
  const m = habit.metrics || { currentStreak: 0, unit: 'DAY' };
  const done = daily ? habit.todayStatus === 'COMPLETED' : cp.completedCount >= cp.target;
  const neg = habit.modality === 'NEGATIVE';

  return (
    <div className={`hcard${done ? ' hcard--done' : ''}`}>
      <button className="hcard__body" onClick={() => onOpen(habit.id)}>
        <span className="hcard__name">{habit.name}</span>
        <span className="hcard__meta">
          {daily ? (
            <WeekStrip marks={habit.marks || {}} />
          ) : (
            <>
              {cp.target <= 7 ? (
                <span className="pips" aria-hidden="true">
                  {Array.from({ length: cp.target }).map((_, i) => (
                    <span key={i} className={`pip${i < cp.completedCount ? ' pip--on' : ''}`} />
                  ))}
                </span>
              ) : (
                <span className="hcard__pmeta">{cp.completedCount} of {cp.target}</span>
              )}
              <span className="hcard__pmeta">{habit.frequency === 'WEEKLY' ? 'this week' : 'this month'}</span>
            </>
          )}
          {m.currentStreak > 0 ? <StreakChip streak={m.currentStreak} unit={m.unit} /> : null}
        </span>
      </button>

      <div className="hcard__action">
        {daily ? (
          <button className="markdot" data-done={done} disabled={pending}
            aria-pressed={done}
            aria-label={done
              ? `Mark ${habit.name} not ${neg ? 'clean' : 'done'} today`
              : `Mark ${habit.name} ${neg ? 'clean' : 'done'} today`}
            title={done ? 'Undo today' : neg ? 'Stayed clean today' : 'Mark done today'}
            onClick={() => onMark(habit)}>
            <Icon name="check" className="markdot__ico" size={done ? 22 : 19} />
          </button>
        ) : (
          <button className="logbtn" data-met={done} disabled={pending}
            aria-label={`Log a ${habit.name} session`} onClick={() => onMark(habit)}>
            {done ? <Icon name="check" size={16} /> : <Icon name="plus" size={15} />}
            {done ? 'Met' : 'Log one'}
          </button>
        )}
      </div>
    </div>
  );
}

function Section({ kind, habits, onOpen, onMark, pending, onAdd }) {
  if (!habits.length) return null;
  const pos = kind === 'POSITIVE';
  return (
    <section className="sect">
      <div className="sect__head">
        <span className={`sect__dot sect__dot--${pos ? 'pos' : 'neg'}`} />
        <span className="sect__name">{pos ? 'Building' : 'Breaking'}</span>
        <span className="sect__count">{habits.length}</span>
        <span className="sect__line" />
        <button className="sect__add" onClick={onAdd} aria-label={`Add a ${pos ? 'building' : 'breaking'} habit`}>
          <Icon name="plus" size={14} /> New
        </button>
      </div>
      <div className="cards">
        {habits.map((h) => <HabitCard key={h.id} habit={h} onOpen={onOpen} onMark={onMark} pending={pending === h.id} />)}
      </div>
    </section>
  );
}

function CreateHabitForm({ open, onClose, onCreate, pending, initialModality = 'POSITIVE' }) {
  const [name, setName] = useStateList('');
  const [modality, setModality] = useStateList(initialModality);
  const [frequency, setFrequency] = useStateList('DAILY');
  const [target, setTarget] = useStateList(2);

  useEffectList(() => {
    if (open) { setName(''); setModality(initialModality); setFrequency('DAILY'); setTarget(2); }
  }, [open, initialModality]);
  const close = () => onClose();
  const submit = (e) => {
    e.preventDefault();
    if (!name.trim()) return;
    onCreate({ name: name.trim(), modality, frequency, targetCount: frequency === 'DAILY' ? null : target });
    close();
  };

  return (
    <Dialog open={open} title="Add a habit" onCancel={close}
      footer={<>
        <button type="button" className="btn btn--ghost" onClick={close}>Cancel</button>
        <button type="submit" form="create-habit-form" className="btn btn--primary" disabled={pending || !name.trim()}>
          {pending ? 'Adding…' : 'Add habit'}
        </button>
      </>}>
      <form id="create-habit-form" style={{ display: 'flex', flexDirection: 'column', gap: 18 }} onSubmit={submit}>
        <div className="field">
          <label className="label" htmlFor="hname">Name</label>
          <input id="hname" className="input" value={name} autoFocus placeholder="e.g. Meditate, No phone in bed…"
            onChange={(e) => setName(e.target.value)} />
        </div>
        <div className="field">
          <span className="label">Type</span>
          <Segmented value={modality} onChange={setModality} ariaLabel="Type"
            options={[{ value: 'POSITIVE', label: 'Build' }, { value: 'NEGATIVE', label: 'Break' }]} />
        </div>
        <div className="field">
          <span className="label">Frequency</span>
          <Segmented value={frequency} onChange={setFrequency} ariaLabel="Frequency"
            options={[{ value: 'DAILY', label: 'Daily' }, { value: 'WEEKLY', label: 'Weekly' }, { value: 'MONTHLY', label: 'Monthly' }]} />
        </div>
        {frequency !== 'DAILY' ? (
          <div className="field" style={{ maxWidth: 160 }}>
            <label className="label" htmlFor="tgt">Times per {frequency === 'WEEKLY' ? 'week' : 'month'}</label>
            <input id="tgt" className="input" type="number" min={1} max={frequency === 'WEEKLY' ? 7 : 31} value={target}
              onChange={(e) => setTarget(Math.max(1, Number(e.target.value) || 1))} />
          </div>
        ) : null}
      </form>
    </Dialog>
  );
}

function AddHabitButton({ onClick }) {
  return (
    <div className="addhabit">
      <button className="btn btn--soft addhabit__btn" onClick={onClick}>
        <Icon name="plus" size={18} /> Add a habit
      </button>
    </div>
  );
}

function TodayHero({ habits }) {
  const td = HP.parseISO(HP.TODAY);
  const weekday = td.toLocaleDateString('en-US', { weekday: 'long' });
  const dateStr = td.toLocaleDateString('en-US', { month: 'long', day: 'numeric' });
  const dailies = habits.filter((h) => h.frequency === 'DAILY');
  const done = dailies.filter((h) => h.todayStatus === 'COMPLETED').length;
  const total = dailies.length;
  const allDone = total > 0 && done === total;
  return (
    <div className="today">
      <div className="today__l">
        <span className="today__eyebrow">Today</span>
        <h1 className="today__title">{weekday}</h1>
        <span className="today__sub">{dateStr}</span>
      </div>
      {total > 0 ? (
        <div className="today__r">
          <div className="today__count">
            <b>{allDone ? 'All done' : `${done} of ${total}`}</b>
            <span>{allDone ? 'for today' : 'done today'}</span>
          </div>
          <Ring value={done} total={total} />
        </div>
      ) : null}
    </div>
  );
}

function HabitListScreen({ email, habits, loading, error, onOpen, onMark, onCreate, marking, creating }) {
  const [addOpen, setAddOpen] = useStateList(false);
  const [addModality, setAddModality] = useStateList('POSITIVE');
  const openAdd = (modality = 'POSITIVE') => { setAddModality(modality); setAddOpen(true); };
  return (
    <main className="container page fadein">
      {loading ? (
        <>
          <div className="today">
            <div className="today__l" style={{ gap: 8 }}>
              <Skel w={60} h={12} />
              <Skel w={180} h={36} />
              <Skel w={110} h={16} />
            </div>
            <Skel w={66} h={66} r="50%" />
          </div>
          <div className="today__rule" />
          <div style={{ display: 'flex', flexDirection: 'column', gap: 12, marginTop: 18 }}>
            {[0, 1, 2].map((i) => <Skel key={i} w="100%" h={82} r="var(--radius)" />)}
          </div>
        </>
      ) : error ? (
        <div className="form-err" style={{ marginTop: 28 }}><Icon name="x" size={15} /> {error}</div>
      ) : habits.length === 0 ? (
        <>
          <TodayHero habits={habits} />
          <div className="today__rule" />
          <div className="empty" style={{ marginTop: 24 }}>
            <Icon name="sprout" size={40} className="empty__ico" />
            <p style={{ margin: 0, fontWeight: 600, color: 'var(--ink-2)' }}>No habits yet</p>
            <p style={{ margin: '6px 0 0' }}>Create your first one, building or breaking.</p>
          </div>
          <AddHabitButton onClick={() => openAdd('POSITIVE')} />
        </>
      ) : (
        <>
          <TodayHero habits={habits} />
          <div className="today__rule" />
          <Section kind="POSITIVE" habits={habits.filter((h) => h.modality === 'POSITIVE')} onOpen={onOpen} onMark={onMark} pending={marking} onAdd={() => openAdd('POSITIVE')} />
          <Section kind="NEGATIVE" habits={habits.filter((h) => h.modality === 'NEGATIVE')} onOpen={onOpen} onMark={onMark} pending={marking} onAdd={() => openAdd('NEGATIVE')} />
        </>
      )}
      {!loading && !error ? (
        <CreateHabitForm open={addOpen} onClose={() => setAddOpen(false)} onCreate={onCreate} pending={creating} initialModality={addModality} />
      ) : null}
    </main>
  );
}

Object.assign(window, { HabitListScreen });

  </script>

  <script type="text/babel" data-presets="react" data-src="screens-detail.jsx">
/* habitpair — habit detail: metrics strip, calendar, best streaks, edit/delete */
const { useState: useStateD, useMemo: useMemoD, useRef: useRefD, useEffect: useEffectD } = React;

function HabitActionsMenu({ onEdit, onDelete }) {
  const [open, setOpen] = useStateD(false);
  const ref = useRefD(null);
  useEffectD(() => {
    if (!open) return;
    const onDoc = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    const onKey = (e) => { if (e.key === 'Escape') setOpen(false); };
    document.addEventListener('mousedown', onDoc);
    window.addEventListener('keydown', onKey);
    return () => { document.removeEventListener('mousedown', onDoc); window.removeEventListener('keydown', onKey); };
  }, [open]);
  return (
    <div className="hmenu" ref={ref}>
      <button className="hmenu__trigger" aria-haspopup="menu" aria-expanded={open} aria-label="Habit actions"
        onClick={() => setOpen((o) => !o)}>
        <span className="hmenu__dots" aria-hidden="true"><i /><i /><i /></span>
      </button>
      {open ? (
        <div className="acct__menu" role="menu" style={{ width: 190 }}>
          <button className="acct__item" role="menuitem" onClick={() => { setOpen(false); onEdit(); }}>
            <Icon name="edit" size={16} /> Edit habit
          </button>
          <div className="acct__sep" />
          <button className="acct__item acct__item--danger" role="menuitem" onClick={() => { setOpen(false); onDelete(); }}>
            <Icon name="trash" size={16} /> Delete habit
          </button>
        </div>
      ) : null}
    </div>
  );
}

const UNIT_NOUN = { DAY: 'day', WEEK: 'week', MONTH: 'month' };
const WINDOW_SIZE = { DAY: 30, WEEK: 8, MONTH: 6 };
const plural = (n, noun) => `${n} ${noun}${n === 1 ? '' : 's'}`;
const streakLabel = (len, unit) => plural(len, UNIT_NOUN[unit]);
const windowLabel = (unit) => plural(WINDOW_SIZE[unit], UNIT_NOUN[unit]);
const pctLabel = (p) => (p == null ? '–' : `${p}%`);
function completionLabel(rc) {
  if (rc.percent == null) return '–';
  return rc.phase === 'RATIO' ? `${rc.numerator} of ${rc.denominator}` : `${rc.percent}%`;
}
function fmtDate(iso, opts) { return HP.parseISO(iso).toLocaleDateString('en-US', opts); }
const dateLabel = (iso) => fmtDate(iso, { year: 'numeric', month: 'short', day: 'numeric' });
function rangeLabel(start, end) {
  if (start === end) return dateLabel(start);
  const sameYear = start.slice(0, 4) === end.slice(0, 4);
  const sl = sameYear ? fmtDate(start, { month: 'short', day: 'numeric' }) : dateLabel(start);
  return `${sl} – ${dateLabel(end)}`;
}
function freqText(freq, target) {
  if (freq === 'DAILY') return 'Daily';
  return `${target ?? 1}× per ${freq === 'WEEKLY' ? 'week' : 'month'}`;
}

function StatRing({ pct, tone, size = 44, stroke = 5 }) {
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const p = Math.max(0, Math.min(1, (pct || 0) / 100));
  return (
    <div className="statring" style={{ width: size, height: size }}>
      <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
        <circle className="statring__track" cx={size / 2} cy={size / 2} r={r} strokeWidth={stroke} />
        <circle className={`statring__fill${tone === 'success' ? ' statring__fill--success' : ''}`}
          cx={size / 2} cy={size / 2} r={r} strokeWidth={stroke}
          strokeDasharray={c} strokeDashoffset={c * (1 - p)} />
      </svg>
    </div>
  );
}

function MetricCard({ label, value, unit, sub, ico, ringPct, tone }) {
  return (
    <div className="statcard">
      <div className="statcard__top">
        <span className={`statcard__chip${tone === 'success' ? ' statcard__chip--success' : ''}`}>
          <Icon name={ico} size={15} />
        </span>
        <span className="statcard__label">{label}</span>
      </div>
      <div className="statcard__body">
        <div className="statcard__val">{value}{unit ? <span className="u">{unit}</span> : null}</div>
        {ringPct !== undefined ? <StatRing pct={ringPct} tone={tone} /> : null}
      </div>
      {sub ? <div className="statcard__sub">{sub}</div> : null}
    </div>
  );
}

function HabitMetrics({ m, firstMark }) {
  if (firstMark == null) return null;
  const streakParts = streakLabel(m.currentStreak, m.unit).split(' ');
  const best = m.bestStreaks && m.bestStreaks[0] ? m.bestStreaks[0].length : 0;
  const streakSub = m.currentStreak === 0
    ? 'No active streak'
    : (m.currentStreak >= best ? 'Your personal best' : `Best · ${plural(best, UNIT_NOUN[m.unit])}`);
  return (
    <div className="metrics">
      <MetricCard ico="flame" label="Current streak" value={streakParts[0]} unit={streakParts[1]} sub={streakSub} />
      <MetricCard ico="spark" label="Consistency" value={pctLabel(m.rollingConsistency.percent)}
        sub={`last ${windowLabel(m.unit)}`} ringPct={m.rollingConsistency.percent} />
      <MetricCard ico="target" label="Completion" value={completionLabel(m.recentCompletion)}
        sub="all time" ringPct={m.recentCompletion.percent} />
    </div>
  );
}

function StreakRow({ s, unit, maxLen, rank, current }) {
  const fill = Math.max(5, Math.round((s.length / maxLen) * 100));
  const noun = UNIT_NOUN[unit];
  return (
    <div className={`streakrow${current ? ' streakrow--current' : ''}${rank === 1 ? ' streakrow--top' : ''}`}>
      <span className="streakrow__rank">
        {rank == null ? <Icon name="flame" size={14} style={{ color: 'var(--accent)' }} /> : rank}
      </span>
      <div className="streakrow__main">
        <div className="streakrow__top">
          <span className="streakrow__range">{rangeLabel(s.start, s.end)}</span>
          <span className="streakrow__len">
            {s.length}<span className="streakrow__unit">{noun}{s.length === 1 ? '' : 's'}</span>
            {current ? <span className="streak__badge">Current</span> : null}
          </span>
        </div>
        <div className="streakrow__track">
          <div className={`streakrow__fill${current ? ' streakrow__fill--current' : ''}`} style={{ width: fill + '%' }} />
        </div>
      </div>
    </div>
  );
}

function BestStreaks({ m }) {
  const [showAll, setShowAll] = useStateD(false);
  if (!m.bestStreaks.length) return null;
  const maxLen = m.bestStreaks[0].length;
  const cur = m.currentRun;
  const inList = cur != null && m.bestStreaks.some((s) => s.start === cur.start);
  const pinned = cur != null && !inList;
  const toBeat = pinned ? m.bestStreaks[m.bestStreaks.length - 1].length - cur.length : 0;
  const LIMIT = 5;
  const list = showAll ? m.bestStreaks : m.bestStreaks.slice(0, LIMIT);
  const hidden = m.bestStreaks.length - LIMIT;
  return (
    <section className="streaks">
      <div className="streaks__head">
        <Icon name="flame" size={17} style={{ color: 'var(--accent)' }} />
        <h3 className="streaks__title">Best streaks</h3>
      </div>
      <div className="card streaks__card">
        <div className="streaks__list">
          {list.map((s, i) => (
            <StreakRow key={`${s.start}:${s.end}`} s={s} unit={m.unit} maxLen={maxLen}
              rank={i + 1} current={cur != null && s.start === cur.start} />
          ))}
        </div>
        {hidden > 0 ? (
          <button className="streaks__more" onClick={() => setShowAll((v) => !v)}>
            {showAll ? 'Show less' : `Show all ${m.bestStreaks.length}`}
            <Icon name={showAll ? 'chevU' : 'chevD'} size={14} />
          </button>
        ) : null}
        {pinned ? (
          <div className="streaks__divider">
            <StreakRow s={cur} unit={m.unit} maxLen={maxLen} rank={null} current />
            <p className="streaks__nudge">{streakLabel(toBeat, m.unit)} to crack the top {m.bestStreaks.length}.</p>
          </div>
        ) : null}
      </div>
    </section>
  );
}

function DetailSkeleton() {
  return (
    <main className="container page">
      <Skel w={110} h={16} />
      <div style={{ marginTop: 18 }}><Skel w="50%" h={32} /></div>
      <div className="metrics">{[0,1,2].map((i) => <Skel key={i} w="100%" h={92} r="var(--radius)" />)}</div>
      <div style={{ marginTop: 26 }}><Skel w="100%" h={240} r="var(--radius)" /></div>
    </main>
  );
}

function HabitDetailScreen({ habit, calData, metrics, loading, span, setSpan, endMonth, setEndMonth,
  onBack, onCycle, onSave, onDelete, deleting }) {
  const [editing, setEditing] = useStateD(false);
  const [confirming, setConfirming] = useStateD(false);
  const [eName, setEName] = useStateD('');
  const [eMod, setEMod] = useStateD('POSITIVE');

  if (loading || !habit) return <DetailSkeleton />;
  const pos = habit.modality === 'POSITIVE';

  return (
    <main className="container page fadein">
      <div className="detail__bar">
        <button className="backbtn" onClick={onBack}><Icon name="arrowL" size={15} /> Back to habits</button>
        <HabitActionsMenu
          onEdit={() => { setEName(habit.name); setEMod(habit.modality); setEditing(true); }}
          onDelete={() => setConfirming(true)} />
      </div>

      <div className="detail__head">
        <span className="detail__meta">
          <span className={`tag__chip ${pos ? 'tag__chip--pos' : 'tag__chip--neg'}`}>{pos ? 'Building' : 'Breaking'}</span>
          <span className="detail__freq">{freqText(habit.frequency, habit.targetCount)}</span>
        </span>
        <h1 className="h1 detail__title">{habit.name}</h1>
      </div>

      <HabitMetrics m={metrics} firstMark={calData.firstMarkDate} />

      <HabitCalendar data={calData} endMonth={endMonth} setEndMonth={setEndMonth} onCycle={onCycle} />

      <HabitPatterns habit={habit} firstMark={calData.firstMarkDate} />

      <BestStreaks m={metrics} />

      <Dialog open={editing} title="Edit habit" onCancel={() => setEditing(false)}
        footer={<>
          <button type="button" className="btn btn--ghost" onClick={() => setEditing(false)}>Cancel</button>
          <button type="submit" form="edit-habit-form" className="btn btn--primary" disabled={!eName.trim()}>Save changes</button>
        </>}>
        <form id="edit-habit-form" style={{ display: 'flex', flexDirection: 'column', gap: 18 }}
          onSubmit={(e) => { e.preventDefault(); if (!eName.trim()) return; onSave({ name: eName.trim(), modality: eMod }); setEditing(false); }}>
          <div className="field">
            <label className="label" htmlFor="ename">Name</label>
            <input id="ename" className="input" value={eName} autoFocus onChange={(e) => setEName(e.target.value)} />
          </div>
          <div className="field">
            <span className="label">Type</span>
            <Segmented value={eMod} onChange={setEMod} ariaLabel="Type"
              options={[{ value: 'POSITIVE', label: 'Build' }, { value: 'NEGATIVE', label: 'Break' }]} />
          </div>
          <p className="field__hint">{freqText(habit.frequency, habit.targetCount)} · frequency can’t be changed.</p>
        </form>
      </Dialog>

      <Dialog open={confirming} title="Delete habit" onCancel={() => setConfirming(false)}
        footer={<>
          <button className="btn btn--ghost" onClick={() => setConfirming(false)}>Cancel</button>
          <button className="btn btn--danger-solid" disabled={deleting} onClick={() => onDelete()}>{deleting ? 'Deleting…' : 'Delete habit'}</button>
        </>}>
        Delete “{habit.name}” and all its marks? This can’t be undone.
      </Dialog>
    </main>
  );
}

Object.assign(window, { HabitDetailScreen });

  </script>

  <script type="text/babel" data-presets="react" data-src="screens-settings.jsx">
/* habitpair — Settings: appearance (theme), data export, danger zone */
const { useState: useStateSet } = React;

function SettingsScreen({ email, theme, setTheme, onExport, onDeleteAccount, onBack, backLabel = 'Back to habits' }) {
  const [confirming, setConfirming] = useStateSet(false);
  return (
    <main className="container container--narrow page fadein">
      <div className="detail__bar">
        <button className="backbtn" onClick={onBack}><Icon name="arrowL" size={15} /> {backLabel}</button>
      </div>
      <h1 className="h1" style={{ marginTop: 18 }}>Settings</h1>
      <p className="muted" style={{ marginTop: 4 }}>{email}</p>

      <section className="set__group">
        <h2 className="eyebrow" style={{ marginBottom: 4 }}>Appearance</h2>
        <div className="set__row">
          <div className="set__row-main">
            <div className="set__row-label">Theme</div>
            <div className="set__row-desc">Light, dark, or follow your system.</div>
          </div>
          <Segmented value={theme} onChange={setTheme} ariaLabel="Theme"
            options={[{ value: 'light', label: 'Light' }, { value: 'dark', label: 'Dark' }, { value: 'system', label: 'System' }]} />
        </div>
      </section>

      <section className="set__group">
        <h2 className="eyebrow" style={{ marginBottom: 4 }}>Your data</h2>
        <div className="set__row">
          <div className="set__row-main">
            <div className="set__row-label">Export data</div>
            <div className="set__row-desc">Download all your habits and marks as a JSON file.</div>
          </div>
          <button className="btn btn--ghost btn--sm" onClick={onExport}><Icon name="download" size={15} /> Export</button>
        </div>
      </section>

      <section className="set__group">
        <h2 className="eyebrow" style={{ marginBottom: 4, color: 'var(--miss-ink)' }}>Danger zone</h2>
        <div className="set__row">
          <div className="set__row-main">
            <div className="set__row-label">Delete account</div>
            <div className="set__row-desc">Permanently remove your account and every habit. This can’t be undone.</div>
          </div>
          <button className="btn btn--danger btn--sm" onClick={() => setConfirming(true)}><Icon name="trash" size={15} /> Delete</button>
        </div>
      </section>

      <Dialog open={confirming} title="Delete your account?" onCancel={() => setConfirming(false)}
        footer={<>
          <button className="btn btn--ghost" onClick={() => setConfirming(false)}>Cancel</button>
          <button className="btn btn--danger-solid" onClick={() => { setConfirming(false); onDeleteAccount(); }}>Delete everything</button>
        </>}>
        This removes <strong>{email}</strong> and all of its habits and marks for good. There’s no recovery.
      </Dialog>
    </main>
  );
}

Object.assign(window, { SettingsScreen });

  </script>

  <script type="text/babel" data-presets="react" data-src="app.jsx">
/* habitpair — app shell: routing, navbar, state, theme, tweaks, persistence */
const { useState: useS, useEffect: useE, useMemo: useM, useRef: useR } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "direction": "soft",
  "accent": "green",
  "status": "muted",
  "radius": 14
}/*EDITMODE-END*/;

const ACCENTS = [{ name: 'green', hex: '#2e7d5b' }, { name: 'teal', hex: '#3a8f86' }, { name: 'violet', hex: '#6d5ae0' }, { name: 'clay', hex: '#c46a3c' }];
const hexOf = (n) => (ACCENTS.find((a) => a.name === n) || ACCENTS[0]).hex;
const nameOf = (h) => (ACCENTS.find((a) => a.hex === h) || ACCENTS[0]).name;
const EMAIL = 'ivan.zakharanka@airhelp.com';
const ls = { get: (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch { return d; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };

function loadHabits() {
  try { const raw = localStorage.getItem('hp_habits'); if (raw) return JSON.parse(raw); } catch {}
  return HP.seedHabits();
}

function curMonth() { return HP.TODAY.slice(0, 7); }

// We never collect a name — so derive only a neutral single-letter monogram from
// the email. Avoid faking a "First Last", which would imply profile data we don't have.
function acctInitials(email) {
  const local = (email.split('@')[0] || 'u').replace(/[^a-z0-9]/gi, '');
  return (local[0] || 'u').toUpperCase();
}

function AccountMenu({ email, go }) {
  const [open, setOpen] = useS(false);
  const ref = useR(null);
  useE(() => {
    if (!open) return;
    const onDoc = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    const onKey = (e) => { if (e.key === 'Escape') setOpen(false); };
    document.addEventListener('mousedown', onDoc);
    window.addEventListener('keydown', onKey);
    return () => { document.removeEventListener('mousedown', onDoc); window.removeEventListener('keydown', onKey); };
  }, [open]);
  return (
    <div className="acct" ref={ref}>
      <button className="avatar" aria-haspopup="menu" aria-expanded={open} aria-label="Account menu"
        onClick={() => setOpen((o) => !o)}>{acctInitials(email)}</button>
      {open ? (
        <div className="acct__menu" role="menu">
          <div className="acct__id">
            <span className="avatar">{acctInitials(email)}</span>
            <div className="acct__id-main">
              <div className="acct__id-name" title={email}>{email}</div>
              <div className="acct__id-email">Signed in</div>
            </div>
          </div>
          <button className="acct__item" role="menuitem" onClick={() => { setOpen(false); go('settings'); }}>
            <Icon name="gear" size={17} /> Settings
          </button>
          <div className="acct__sep" />
          <button className="acct__item acct__item--danger" role="menuitem" onClick={() => { setOpen(false); go('logout'); }}>
            <Icon name="logout" size={17} /> Log out
          </button>
        </div>
      ) : null}
    </div>
  );
}

function Navbar({ authed, effTheme, onTheme, go, route }) {
  return (
    <nav className="nav">
      <div className="nav__inner">
        <button className="brand" onClick={() => go(authed ? 'list' : 'landing')}>
          <span className="brand__mark" /> habitpair
        </button>
        <div className="nav__right">
          {authed ? (
            <AccountMenu email={EMAIL} go={go} />
          ) : (
            <button className="btn btn--ghost btn--sm" onClick={() => go('login')}>Log in</button>
          )}
        </div>
      </div>
    </nav>
  );
}

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [theme, setTheme] = useS(() => ls.get('hp_theme', 'system'));
  const [sysDark, setSysDark] = useS(() => window.matchMedia('(prefers-color-scheme: dark)').matches);
  const [authed, setAuthed] = useS(() => ls.get('hp_auth', '1') === '1');
  const [route, setRoute] = useS(() => ls.get('hp_route', authed ? 'list' : 'landing'));
  const [detailId, setDetailId] = useS(() => ls.get('hp_detail', '') || null);
  const [settingsReturn, setSettingsReturn] = useS(null);
  const [habits, setHabits] = useS(loadHabits);

  const [bootLoading, setBootLoading] = useS(true);
  const [detailLoading, setDetailLoading] = useS(false);
  const [marking, setMarking] = useS(null);
  const [pending, setPending] = useS(false);
  const [deleting, setDeleting] = useS(false);
  const [toast, setToast] = useS(null);

  const [span, setSpan] = useS(() => (window.innerWidth < 700 ? '1' : '3'));
  const [endMonth, setEndMonth] = useS(curMonth);

  const effTheme = theme === 'system' ? (sysDark ? 'dark' : 'light') : theme;

  useE(() => { const mq = window.matchMedia('(prefers-color-scheme: dark)'); const f = (e) => setSysDark(e.matches); mq.addEventListener('change', f); return () => mq.removeEventListener('change', f); }, []);
  useE(() => { const id = setTimeout(() => setBootLoading(false), 650); return () => clearTimeout(id); }, []);
  useE(() => ls.set('hp_theme', theme), [theme]);
  useE(() => ls.set('hp_auth', authed ? '1' : '0'), [authed]);
  useE(() => ls.set('hp_route', route), [route]);
  useE(() => ls.set('hp_detail', detailId || ''), [detailId]);
  useE(() => { try { localStorage.setItem('hp_habits', JSON.stringify(habits)); } catch {} }, [habits]);

  const listItems = useM(() => habits.map((h) => ({
    ...HP.computeListItem(h),
    metrics: HP.computeMetrics(h),
    marks: h.marks,
    start: h.start,
  })), [habits]);
  const habit = useM(() => habits.find((h) => h.id === detailId) || null, [habits, detailId]);
  const calData = useM(() => (habit ? HP.computeCalendar(habit) : null), [habit]);
  const metrics = useM(() => (habit ? HP.computeMetrics(habit) : null), [habit]);

  function go(r, id) {
    if (r === 'logout') { setAuthed(false); setRoute('landing'); return; }
    if (r === 'settings') setSettingsReturn({ route, detailId });
    if (r === 'detail') { setDetailId(id); setSpan(window.innerWidth < 700 ? '1' : '3'); setEndMonth(curMonth()); setDetailLoading(true); setTimeout(() => setDetailLoading(false), 420); }
    setRoute(r);
    window.scrollTo(0, 0);
  }

  function authSubmit() { setPending(true); setTimeout(() => { setPending(false); setAuthed(true); go('list'); }, 650); }

  function patchHabit(id, fn) { setHabits((prev) => prev.map((h) => (h.id === id ? fn({ ...h, marks: { ...h.marks } }) : h))); }

  function markToday(item) {
    setMarking(item.id);
    setTimeout(() => {
      patchHabit(item.id, (h) => { if (h.marks[HP.TODAY] === 'COMPLETED') delete h.marks[HP.TODAY]; else h.marks[HP.TODAY] = 'COMPLETED'; return h; });
      setMarking(null);
    }, 200);
  }

  function cycle(iso) {
    if (!habit) return;
    patchHabit(habit.id, (h) => {
      const cur = h.marks[iso];
      if (h.frequency === 'DAILY') { if (!cur) h.marks[iso] = 'COMPLETED'; else if (cur === 'COMPLETED') h.marks[iso] = 'MISSED'; else delete h.marks[iso]; }
      else { if (cur === 'COMPLETED') delete h.marks[iso]; else h.marks[iso] = 'COMPLETED'; }
      return h;
    });
  }

  function createHabit(input) {
    setPending(true);
    setTimeout(() => {
      const id = 'h_' + Date.now();
      setHabits((prev) => [...prev, { id, ...input, start: HP.TODAY, marks: {} }]);
      setPending(false);
      setToast({ message: `“${input.name}” added.` });
    }, 250);
  }

  function saveHabit(patch) { patchHabit(habit.id, (h) => ({ ...h, ...patch })); setToast({ message: 'Changes saved.' }); }

  function deleteHabit() {
    setDeleting(true);
    const name = habit.name; const id = habit.id;
    setTimeout(() => { setHabits((prev) => prev.filter((h) => h.id !== id)); setDeleting(false); setDetailId(null); go('list'); setToast({ message: `“${name}” deleted.` }); }, 250);
  }

  function exportData() {
    try {
      const blob = new Blob([JSON.stringify({ email: EMAIL, exportedAt: new Date().toISOString(), habits }, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob); const a = document.createElement('a');
      a.href = url; a.download = 'habitpair-export.json'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    } catch {}
    setToast({ message: 'Your data was exported.' });
  }

  function deleteAccount() { setHabits([]); try { localStorage.removeItem('hp_habits'); } catch {} setAuthed(false); setRoute('landing'); setToast({ message: 'Account deleted.' }); }

  // route guard
  useE(() => { if (!authed && ['list', 'detail', 'settings'].includes(route)) setRoute('landing'); }, [authed, route]);

  let screen;
  if (!authed && route === 'login') screen = <AuthCard mode="login" go={go} onSubmit={authSubmit} pending={pending} />;
  else if (!authed && route === 'register') screen = <AuthCard mode="register" go={go} onSubmit={authSubmit} pending={pending} />;
  else if (route === 'settings') screen = <SettingsScreen email={EMAIL} theme={theme} setTheme={setTheme} onExport={exportData} onDeleteAccount={deleteAccount} backLabel={settingsReturn && settingsReturn.route === 'detail' ? 'Back' : 'Back to habits'} onBack={() => { const ret = settingsReturn; if (ret && ret.route === 'detail' && ret.detailId) { setDetailId(ret.detailId); setRoute('detail'); } else { setRoute((ret && ret.route) || 'list'); } window.scrollTo(0, 0); }} />;
  else if (route === 'detail') screen = <HabitDetailScreen habit={habit} calData={calData} metrics={metrics} loading={detailLoading || !habit} span={span} setSpan={setSpan} endMonth={endMonth} setEndMonth={setEndMonth} onBack={() => go('list')} onCycle={cycle} onSave={saveHabit} onDelete={deleteHabit} deleting={deleting} />;
  else if (authed && route === 'list') screen = <HabitListScreen email={EMAIL} habits={listItems} loading={bootLoading} onOpen={(id) => go('detail', id)} onMark={markToday} onCreate={createHabit} marking={marking} creating={pending} />;
  else screen = <Landing authed={authed} go={go} />;

  return (
    <div className="app" data-theme={effTheme} data-direction="soft" data-accent="green" data-status="muted" style={{ '--radius': '14px' }}>
      <Navbar authed={authed} effTheme={effTheme} onTheme={setTheme} go={go} route={route} />
      {screen}
      {toast ? <Toast message={toast.message} onDone={() => setToast(null)} duration={2600} /> : null}

      <TweaksPanel title="Tweaks">
        <TweakSection label="Theme" />
        <TweakRadio label="Mode" value={theme}
          options={[{ value: 'light', label: 'Light' }, { value: 'dark', label: 'Dark' }, { value: 'system', label: 'Auto' }]}
          onChange={setTheme} />
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

  </script>
